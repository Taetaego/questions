<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>질문·요청 페이지 모음</title>
<style>
/* 모음 페이지(나만 봄). 2026-11-20 저자 "초록색 글래스 느낌", 2026-11-22 저자 시안 A "글래스 스타일로":
   초록 물빛 배경 + 유리 카드, 맨 위 한눈에 칸 셋, 질문은 둥근 진행 그래프, 요청은 새/하는 중/끝 세 칸.
   색은 초록 한 계열. 처리할 것이 있을 때만 첫 칸이 진초록으로 바뀐다(끝난 것이 가장 조용). */
:root { --ink: #0f3d2a; --muted: #3e5a4c; --main: #0f6e43; --glass: rgba(255,255,255,.62); --edge: rgba(255,255,255,.9); --shadow: 0 6px 20px rgba(20,110,70,.10); --r: 18px }
* { box-sizing: border-box }
html { background: #e3f5ea }
body { margin: 0; color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; word-break: keep-all; min-height: 100vh;
  background: radial-gradient(520px 420px at 8% -4%, rgba(74,222,128,.5), transparent 70%), radial-gradient(560px 460px at 96% 38%, rgba(45,212,191,.4), transparent 70%),
  radial-gradient(480px 420px at 30% 104%, rgba(134,239,172,.6), transparent 70%), linear-gradient(160deg, #d7f5e3 0%, #eefaf3 45%, #dff4ec 100%); background-attachment: fixed }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 16px; padding: 14px 24px; background: rgba(255,255,255,.45);
  -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid rgba(255,255,255,.75) }
.brand { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column }
.brand small { font-size: 12px; color: var(--muted); letter-spacing: .4px }
h1 { margin: 0; font-size: 20px; letter-spacing: -.3px }
.upd { color: var(--muted); font-size: 13px; width: 6.5em; text-align: right; white-space: nowrap; flex: none }
button { font: inherit; font-size: 14px; min-height: 40px; min-width: 6.5em; padding: 0 14px; border-radius: 12px; border: 1px solid var(--edge); background: rgba(255,255,255,.75); color: var(--ink); cursor: pointer; flex: none }
.wrap { max-width: 1120px; margin: 0 auto; padding: 24px 24px 48px; display: flex; flex-direction: column; gap: 28px }
.sum { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px }
.tile { padding: 16px 18px; border-radius: var(--r); background: var(--glass); border: 1px solid var(--edge); box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 6px; min-height: 112px; min-width: 0 }
.tile span { font-size: 13px; color: var(--muted) }
.tile b { font-size: 32px; line-height: 1; font-variant-numeric: tabular-nums }
.tile.hot { background: var(--main); border-color: var(--main); color: #fff; box-shadow: 0 10px 28px rgba(15,110,67,.25) }
.tile.hot span { color: #dff3e8 }
section { display: flex; flex-direction: column; gap: 12px }
h2 { margin: 0; font-size: 18px; display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap }
h2 small { font-size: 13px; font-weight: 400; color: var(--muted) }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px }
.card { padding: 18px 20px; border-radius: var(--r); background: var(--glass); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid var(--edge); box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.9); display: flex; flex-direction: column; gap: 12px; min-height: 196px; min-width: 0 }
.top { display: flex; align-items: center; gap: 10px }
.kind { font-size: 12px; width: 3.4em; text-align: center; padding: 3px 0; border-radius: 7px; background: rgba(255,255,255,.85); color: #2f4a3c; flex: none }
.top b { flex: 1 1 auto; font-size: 16px; min-width: 0; overflow-wrap: anywhere }
.top a { flex: none; font-size: 13px; font-weight: 600; color: var(--main); text-decoration: none; padding: 6px 12px; border-radius: 10px; border: 1px solid rgba(20,128,79,.25); background: rgba(255,255,255,.75); white-space: nowrap }
.top a:hover { background: #fff }
.prog { display: flex; align-items: center; gap: 16px }
.prog svg { flex: none }
.prog .tx { display: flex; flex-direction: column; gap: 2px; font-size: 14px }
.muted { color: var(--muted); font-size: 13px }
.stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; text-align: center }
.stats div { padding: 10px 0; border-radius: 12px; background: rgba(255,255,255,.6) }
.stats b { display: block; font-size: 22px; line-height: 1.2; font-variant-numeric: tabular-nums }
.stats span { font-size: 12px; color: var(--muted) }
.stats .on { background: var(--main); color: #fff } .stats .on span { color: #dff3e8 }
ul { margin: 0; padding: 10px 12px; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; background: rgba(255,255,255,.55); border-radius: 12px }
li { display: flex; gap: 8px; align-items: baseline }
li .t { color: var(--muted); white-space: nowrap; min-width: 5.5em }
li .x { flex: 1 1 auto; overflow-wrap: anywhere }
.err { color: #8a4b0f; font-size: 13px; margin: 0 }
.empty { color: var(--muted); font-size: 13px; margin: 0 }
.foot { color: var(--muted); font-size: 12px; margin: 0 }
@media (max-width: 640px) {
  header { padding: 12px 16px; gap: 10px } .upd { display: none } .wrap { padding: 16px 16px 40px; gap: 22px }
  .sum { gap: 8px } .tile { padding: 12px; min-height: 96px } .tile b { font-size: 26px } .tile span { font-size: 12px }
  .grid { grid-template-columns: minmax(0, 1fr) } .card { min-height: 0 }
}
@media (prefers-reduced-transparency: reduce) { header, .card { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none } }
/* 불러오는 동안(2026-11-22): 0.15초 안에 다 오면 안 보이고, 늦을 때만 돌이 + 빈 유리 칸이 반짝인다 */
.loading { animation: ldin .25s .15s both; display: flex; flex-direction: column; gap: 28px }
.ld-head { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-size: 14px }
/* 진행 중 원호: TaeKit Busy(Sources/TaeKit/Controls.swift)와 같은 움직임 — 1.4초 주기로 머리가 72%까지 뻗고 꼬리가 따라붙으며, 전체는 1.23초에 한 바퀴 */
.spin { width: 16px; height: 16px; flex: none; animation: spin 1.23s linear infinite; }
.spin circle { fill: none; stroke: var(--main); stroke-width: 2; stroke-linecap: round; stroke-dasharray: 6 100; animation: arc 1.4s ease-in-out infinite; }
@keyframes arc { 0% { stroke-dasharray: 6 100; stroke-dashoffset: 0; } 50% { stroke-dasharray: 78 100; stroke-dashoffset: 0; } 100% { stroke-dasharray: 6 100; stroke-dashoffset: -72; } }
.sk { border-radius: var(--r); border: 1px solid var(--edge); background: linear-gradient(90deg, rgba(255,255,255,.4) 25%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.4) 75%); background-size: 200% 100%; animation: shim 1.3s ease-in-out infinite }
.sk.t { min-height: 112px } .sk.c { min-height: 196px }
@media (max-width: 640px) { .sk.t { min-height: 96px } }
@keyframes ldin { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes shim { from { background-position: 100% 0 } to { background-position: -100% 0 } }
@media (prefers-reduced-motion: reduce) { .spin, .spin circle, .sk { animation: none } }
</style>
</head>
<body>
<header><div class="brand"><small>고객 창구</small><h1>질문·요청 페이지 모음</h1></div><span class="upd" id="upd">불러오는 중…</span><button id="again" type="button">새로 보기</button></header>
<div class="wrap">
  <div id="app"><div class="loading" role="status" aria-live="polite"><div class="sum"><div class="sk t ld-head"><svg class="spin" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" pathLength="100"/></svg>불러오는 중…</div><div class="sk t"></div><div class="sk t"></div></div><div class="grid"><div class="sk c"></div><div class="sk c"></div></div></div></div>
</div>
<script>
// 저장소 주소는 이 페이지 주소에서 읽는다(<계정>.github.io/<저장소>/)
var OWNER = location.hostname.split('.')[0], REPO = location.pathname.split('/')[1] || 'questions';
var DB = 'https://question-pages-45aae-default-rtdb.asia-southeast1.firebasedatabase.app';
var pages = null, projects = {};
var $ = function (id) { return document.getElementById(id) };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
function ago(ms) {
  if (!ms) return '';
  var m = Math.round((Date.now() - Number(ms)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전'; if (m < 1440) return Math.round(m / 60) + '시간 전';
  var d = new Date(Number(ms)); return (d.getMonth() + 1) + '/' + d.getDate();
}
function get(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() }) }
function text(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text() }) }
function cut(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s }

// 페이지 목록은 projects.json 의 pages(새 질문 페이지.sh 가 만들 때 적음). 비었을 때만 GitHub 폴더 목록(1시간 60번 제한)을 읽는다.
// 페이지마다 index.html(제목·종류)과 Firebase(답·질문 고친 판·요청)를 한꺼번에 받고, 다 오면 한 번에 그린다(2026-11-22 저자 "계단식으로 로딩됨").
function loadPages() {
  return get('projects.json').catch(function () { return {} }).then(function (pj) {
    projects = pj || {};
    var dirs = Object.keys(projects.pages || {});
    if (dirs.length) return dirs;
    return get('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/').then(function (l) {
      return l.filter(function (f) { return f.type === 'dir' && f.name[0] !== '.' }).map(function (f) { return f.name });
    }).catch(function () { return [] });
  }).then(function (dirs) { return Promise.all(dirs.map(loadOne)) }).then(function (list) { pages = list.filter(Boolean) });
}

function loadOne(name) {
  var base = DB + '/pages/' + name, p = { name: name, err: '' };
  var bad = function (e) { p.err = '못 읽음(' + e.message + ')'; return null };
  return Promise.all([
    text(name + '/index.html').catch(function () { return null }),
    get(base + '/answers.json').catch(bad),
    get(base + '/qset/json.json').catch(function () { return null }),
    get(base + '/requests.json').catch(bad),
    get(name + '/questions.json').catch(function () { return null }),
    get(base + '/settings.json').catch(function () { return null })
  ]).then(function (r) {
    if (r[0] == null) return null;
    var t = (r[0].match(/var TITLE = '((?:[^'\\]|\\.)*)'/) || [])[1] || name;
    p.title = t.replace(/\\(.)/g, '$1'); p.kind = (r[0].match(/var KIND = '(\w+)'/) || [])[1] || 'question';
    if (p.kind === 'request') { p.reqs = r[3] || {}; p.set = r[5] || {}; return p }
    var qs = null; try { qs = r[2] ? JSON.parse(r[2]).questions : null } catch (e) {}
    p.qs = qs || (r[4] && r[4].questions) || []; p.ans = r[1] || {};
    return p;
  });
}

function ring(n, tot) {
  var c = 2 * Math.PI * 26, f = tot ? n / tot : 0;
  return '<svg width="64" height="64" viewBox="0 0 64 64" role="img" aria-label="답 ' + Math.round(f * 100) + '%"><circle cx="32" cy="32" r="26" fill="none" stroke="rgba(16,122,80,.14)" stroke-width="8"/>' +
    (n ? '<circle cx="32" cy="32" r="26" fill="none" stroke="#0f6e43" stroke-width="8" stroke-linecap="round" stroke-dasharray="' + (c * f).toFixed(1) + ' ' + c.toFixed(1) + '" transform="rotate(-90 32 32)"/>' : '') +
    '<text x="32" y="37" text-anchor="middle" font-size="14" font-weight="700" fill="#0f3d2a">' + n + '</text></svg>';
}
function period(until) {
  if (!until) return '';
  var ms = Number(until) - Date.now();
  if (ms <= 0) return '수정 기간 끝남';
  var d = Math.floor(ms / 86400000);
  return '수정 기간 ' + (d ? d + '일' : Math.floor(ms / 3600000) + '시간') + ' 남음';
}
function hoursText(h) {
  var hs = String(h || '').split(',').filter(function (x) { return /^\d+$/.test(x.trim()) });
  return hs.length ? '알림 매일 ' + hs.map(function (x) { return x.trim() + '시' }).join('·') : '알림 시간 아직 안 고름';
}
function reqCount(p) { var c = { new: 0, doing: 0, done: 0 }; Object.keys(p.reqs || {}).forEach(function (k) { var s = (p.reqs[k] || {}).status || 'new'; c[s] = (c[s] || 0) + 1 }); return c }
function has(p, q) { var x = (p.ans || {})[q.id] || {}; return !!(x.answer || x.files) }

function card(p) {
  var h = '<article class="card"><div class="top"><span class="kind">' + (p.kind === 'request' ? '요청' : '질문') + '</span><b>' + esc(p.title) + '</b><a href="' + esc(p.name) + '/" target="_blank" rel="noopener">열기 ↗</a></div>';
  if (p.err) return h + '<p class="err">' + esc(p.err) + '</p></article>';
  if (p.kind === 'request') {
    var c = reqCount(p);
    h += '<div class="stats"><div class="' + (c.new ? 'on' : '') + '"><b>' + c.new + '</b><span>새 요청</span></div><div><b>' + c.doing + '</b><span>하는 중</span></div><div><b>' + c.done + '</b><span>끝</span></div></div>';
    var open = Object.keys(p.reqs || {}).map(function (k) { return p.reqs[k] }).filter(function (r) { return r && r.status !== 'done' }).sort(function (a, b) { return (b.at || 0) - (a.at || 0) }).slice(0, 3);
    if (open.length) h += '<ul>' + open.map(function (r) { return '<li><span class="t">' + esc(ago(r.at)) + '</span><span class="x">' + esc(cut(r.text, 60)) + '</span></li>' }).join('') + '</ul>';
    var s = p.set || {};
    h += '<span class="muted">' + esc([period(s.until), hoursText(s.hours)].filter(Boolean).join(' · ')) + '</span>';
    return h + '</article>';
  }
  var qs = p.qs || [], n = qs.filter(function (q) { return has(p, q) }).length, tot = qs.length;
  var last = qs.filter(function (q) { return has(p, q) }).map(function (q) { return (p.ans[q.id] || {}).at || 0 }).sort().pop();
  h += '<div class="prog">' + ring(n, tot) + '<div class="tx"><span><b>' + n + '</b>/' + tot + ' 답 · ' + (n === tot && tot ? '✓ 다 참' : (tot - n) + '개 남음') + '</span>' + (last ? '<span class="muted">마지막 답 ' + esc(ago(last)) + '</span>' : '<span class="muted">아직 답 없음</span>') + '</div></div>';
  var left = qs.filter(function (q) { return !has(p, q) }).slice(0, 3);
  if (left.length) h += '<ul>' + left.map(function (q) { return '<li><span class="t">' + esc(q.id) + ' 빈칸</span><span class="x">' + esc(cut(q.q, 50)) + '</span></li>' }).join('') + '</ul>';
  return h + '</article>';
}

function render() {
  if (!pages) return;
  if (!pages.length) { $('app').innerHTML = '<p class="empty">아직 페이지가 없습니다.</p>'; return }
  var groups = {}, names = projects.projects || {}, newReq = 0, newPages = 0, waitQ = 0, totQ = 0, nq = 0, nr = 0;
  pages.forEach(function (p) {
    var k = p.name.split('-')[0]; (groups[k] = groups[k] || []).push(p);
    if (p.kind === 'request') { nr++; var c = reqCount(p); newReq += c.new; if (c.new) newPages++ }
    else { nq++; var t = (p.qs || []).length, n = (p.qs || []).filter(function (q) { return has(p, q) }).length; totQ += t; waitQ += t - n }
  });
  var keys = Object.keys(groups).sort();
  var h = '<div class="sum">' +
    '<div class="tile' + (newReq ? ' hot' : '') + '"><span>처리 안 된 새 요청</span><b>' + newReq + '</b><span>' + (newReq ? '요청 페이지 ' + newPages + '곳' : '✓ 모두 처리함') + '</span></div>' +
    '<div class="tile"><span>답 기다리는 질문</span><b>' + waitQ + '</b><span>' + (waitQ ? '질문 ' + totQ + '개 가운데' : '질문 ' + totQ + '개 모두 답함') + '</span></div>' +
    '<div class="tile"><span>프로젝트 · 페이지</span><b>' + keys.length + ' · ' + pages.length + '</b><span>질문 ' + nq + ' · 요청 ' + nr + '</span></div></div>';
  h += keys.map(function (k) {
    return '<section><h2>' + esc(names[k] || k) + ' <small>페이지 ' + groups[k].length + '개</small></h2><div class="grid">' + groups[k].map(card).join('') + '</div></section>';
  }).join('') + '<p class="foot">1분마다 저절로 새로 읽습니다. 페이지 목록은 projects.json, 답·요청은 Firebase에서 읽습니다.</p>';
  $('app').style.cssText = 'display:flex;flex-direction:column;gap:28px';
  $('app').innerHTML = h;
  var d = new Date(); $('upd').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + ' 기준';
}

function refresh() { return loadPages().then(render) }
$('again').addEventListener('click', function () { $('upd').textContent = '읽는 중…'; refresh() });
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
