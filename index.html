<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>질문·요청 페이지 모음</title>
<style>
/* 모음 페이지(나만 봄, 2026-11-20 저자 "초록색 글래스 느낌"): 질문·요청 틀과 같은 초록 계열(초록 한 계열), 유리는 위 머리줄에만 */
:root { --bg: #eef3ef; --card: #fff; --ink: #16261d; --muted: #56655c; --line: #dde7e0; --main: #22704a; --ok: #22704a; --warn: #8a4b0f; --new: #17633c; --soft: #e4efe7; --tint: #f2f5f3; --r: 14px }
* { box-sizing: border-box }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, "Apple SD Gothic Neo", "Pretendard", system-ui, sans-serif; word-break: keep-all }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px 48px }
header { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 12px; margin: 0 -16px 8px; padding: 14px 16px 12px;
  background: rgba(238, 243, 239, .74); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid rgba(22, 38, 29, .07) }
@media (prefers-reduced-transparency: reduce) { header { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none } }
h1 { font-size: 20px; margin: 0; flex: 1 1 auto; letter-spacing: -.2px }
.upd { color: var(--muted); font-size: 13px; min-width: 6em; text-align: right; white-space: nowrap }
button { font: inherit; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; min-height: 36px; border: 1px solid var(--line); background: var(--card); color: var(--ink); border-radius: 10px; padding: 0 12px; cursor: pointer; min-width: 6.5em }
h2 { font-size: 16px; margin: 24px 0 10px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap }
h2 small { color: var(--muted); font-weight: 400; font-size: 13px }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px }
.card { background: var(--card); border: 1px solid rgba(22, 38, 29, .05); border-radius: var(--r); box-shadow: 0 1px 2px rgba(16, 48, 30, .06), 0 2px 8px rgba(16, 48, 30, .04); padding: 14px 16px; min-height: 168px; display: flex; flex-direction: column; gap: 8px }
.top { display: flex; align-items: center; gap: 8px }
.kind { font-size: 12px; width: 3.4em; text-align: center; padding: 2px 0; border-radius: 6px; background: #eaefec; color: #3f4944; white-space: nowrap; flex: none }
.kind.request { background: #eaefec; color: #3f4944 }
.top b { flex: 1 1 auto; font-size: 16px; min-width: 0 }
.top a { flex: none; color: var(--main); font-weight: 600; text-decoration: none; font-size: 13px; white-space: nowrap; border: 1px solid #b9d6c3; border-radius: 8px; padding: 3px 10px }
.top a:hover { background: var(--tint) }
.bar { height: 6px; background: var(--soft); border-radius: 99px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--main); border-radius: 99px }
.nums { display: flex; gap: 14px; font-size: 13px; color: var(--muted); flex-wrap: wrap }
.nums b { color: var(--ink); font-size: 15px }
.nums .new b { color: var(--new) }
.nums .hot { background: #dff0e5; color: var(--new); border-radius: 6px; padding: 0 8px; font-weight: 600 }
.nums .hot b { color: var(--new) }
ul { margin: 0; padding: 10px 12px; list-style: none; display: flex; flex-direction: column; gap: 4px; font-size: 13px; background: var(--tint); border-radius: 10px }
li { display: flex; gap: 8px; align-items: baseline }
li .t { color: var(--muted); white-space: nowrap; min-width: 5.5em }
li .x { flex: 1 1 auto; overflow-wrap: anywhere }
.sub { font-size: 12px; color: var(--muted); margin-top: 2px }
.err { color: var(--warn); font-size: 13px }
.empty { color: var(--muted); font-size: 13px; margin: 0 }
.done-all { color: var(--muted); font-size: 13px; margin: 0 }
.foot { color: var(--muted); font-size: 12px; margin-top: 28px }

/* 나만 보는 판: 초록 물빛 배경 위 유리 카드(잎새 유리) */
:root { --ink: #0f3d2a; --muted: #3e5a4c; --main: #0f6e43; --new: #0f6b3f }
html { background: #e3f5ea }
body { background:
  radial-gradient(520px 420px at 8% -4%, rgba(74, 222, 128, .55), transparent 70%),
  radial-gradient(560px 460px at 96% 38%, rgba(45, 212, 191, .45), transparent 70%),
  radial-gradient(480px 420px at 30% 104%, rgba(134, 239, 172, .65), transparent 70%),
  linear-gradient(160deg, #d7f5e3 0%, #eefaf3 45%, #dff4ec 100%);
  background-attachment: fixed; min-height: 100vh }
header { background: rgba(255, 255, 255, .42); border-bottom: 1px solid rgba(255, 255, 255, .7) }
.card { background: rgba(255, 255, 255, .62); -webkit-backdrop-filter: blur(22px) saturate(160%); backdrop-filter: blur(22px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, .88); box-shadow: 0 6px 20px rgba(20, 110, 70, .10), inset 0 1px 0 rgba(255, 255, 255, .9) }
button { background: rgba(255, 255, 255, .7); border-color: rgba(255, 255, 255, .9) }
.kind, .kind.request { background: rgba(255, 255, 255, .8); color: #2f4a3c }
.top a { background: rgba(255, 255, 255, .7); border-color: rgba(20, 128, 79, .25) }
.bar { background: rgba(16, 122, 80, .12) }
ul { background: rgba(255, 255, 255, .55) }
.nums .hot { background: #0f6e43; color: #fff } .nums .hot b { color: #fff }
@media (prefers-reduced-transparency: reduce) { .card { background: #fff; -webkit-backdrop-filter: none; backdrop-filter: none } }
/* 불러오는 동안(2026-11-22 저자 "로딩중 이펙트"): 0.15초 안에 다 오면 안 보이고, 늦을 때만 돌이 + 빈 유리 카드가 반짝인다 */
.loading { animation: ldin .25s .15s both; margin-top: 24px }
.ld-head { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 14px; margin-bottom: 12px }
.spin { width: 16px; height: 16px; border: 2px solid rgba(15, 110, 67, .18); border-top-color: var(--main); border-radius: 50%; animation: spin .8s linear infinite; flex: none }
.sk { min-height: 168px; border-radius: var(--r); border: 1px solid rgba(255, 255, 255, .88); background: linear-gradient(90deg, rgba(255,255,255,.4) 25%, rgba(255,255,255,.85) 50%, rgba(255,255,255,.4) 75%); background-size: 200% 100%; animation: shim 1.3s ease-in-out infinite }
@keyframes ldin { from { opacity: 0 } to { opacity: 1 } }
@keyframes spin { to { transform: rotate(360deg) } }
@keyframes shim { from { background-position: 100% 0 } to { background-position: -100% 0 } }
@media (prefers-reduced-motion: reduce) { .spin, .sk { animation: none } }
</style>
</head>
<body>
<div class="wrap">
  <header><h1>질문·요청 페이지 모음</h1><span class="upd" id="upd">불러오는 중…</span><button id="again" type="button">새로 보기</button></header>
  <div id="app"><div class="loading" role="status" aria-live="polite"><div class="ld-head"><span class="spin"></span>불러오는 중…</div><div class="grid"><div class="sk"></div><div class="sk"></div><div class="sk"></div></div></div></div>
  <p class="foot">1분마다 저절로 새로 읽습니다. 페이지 목록은 GitHub 저장소 폴더, 답은 Firebase에서 읽습니다.</p>
</div>
<script>
// 저장소 주소는 이 페이지 주소에서 읽는다(<계정>.github.io/<저장소>/)
var OWNER = location.hostname.split('.')[0], REPO = location.pathname.split('/')[1] || 'questions';
var DB = 'https://question-pages-45aae-default-rtdb.asia-southeast1.firebasedatabase.app';
var pages = null, projects = {};
var $ = function (id) { return document.getElementById(id) };
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c] }) }
function ago(ms) {
  if (!ms) return '';
  var m = Math.round((Date.now() - Number(ms)) / 60000);
  if (m < 1) return '방금'; if (m < 60) return m + '분 전'; if (m < 1440) return Math.round(m / 60) + '시간 전';
  var d = new Date(Number(ms)); return (d.getMonth() + 1) + '/' + d.getDate();
}
function get(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() }) }
function text(u) { return fetch(u, { cache: 'no-store' }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.text() }) }
function cut(s, n) { s = String(s || '').replace(/\s+/g, ' ').trim(); return s.length > n ? s.slice(0, n) + '…' : s }

// 페이지 목록은 projects.json 의 pages(새 질문 페이지.sh 가 만들 때 적음). 비었을 때만 GitHub 폴더 목록(1시간 60번 제한)을 읽는다.
// 페이지마다 index.html(제목·종류)과 Firebase(답·질문 고친 판·요청)를 한꺼번에 받고, 다 오면 한 번에 그린다(2026-11-22 저자 "계단식으로 로딩됨").
function loadPages() {
  return get('projects.json').catch(function () { return {} }).then(function (pj) {
    projects = pj || {};
    var dirs = Object.keys(projects.pages || {});
    if (dirs.length) return dirs;
    return get('https://api.github.com/repos/' + OWNER + '/' + REPO + '/contents/').then(function (l) {
      return l.filter(function (f) { return f.type === 'dir' && f.name[0] !== '.' }).map(function (f) { return f.name });
    }).catch(function () { return [] });
  }).then(function (dirs) { return Promise.all(dirs.map(loadOne)) }).then(function (list) { pages = list.filter(Boolean) });
}

function loadOne(name) {
  var base = DB + '/pages/' + name, p = { name: name, err: '' };
  var bad = function (e) { p.err = '못 읽음(' + e.message + ')'; return null };
  return Promise.all([
    text(name + '/index.html').catch(function () { return null }),
    get(base + '/answers.json').catch(bad),
    get(base + '/qset/json.json').catch(function () { return null }),
    get(base + '/requests.json').catch(bad),
    get(name + '/questions.json').catch(function () { return null })
  ]).then(function (r) {
    if (r[0] == null) return null;
    var t = (r[0].match(/var TITLE = '((?:[^'\\]|\\.)*)'/) || [])[1] || name;
    p.title = t.replace(/\\(.)/g, '$1'); p.kind = (r[0].match(/var KIND = '(\w+)'/) || [])[1] || 'question';
    if (p.kind === 'request') { p.reqs = r[3] || {}; return p }
    var qs = null; try { qs = r[2] ? JSON.parse(r[2]).questions : null } catch (e) {}
    p.qs = qs || (r[4] && r[4].questions) || []; p.ans = r[1] || {};
    return p;
  });
}

function card(p) {
  var h = '<div class="card"><div class="top"><span class="kind ' + p.kind + '">' + (p.kind === 'request' ? '요청' : '질문') + '</span><b>' + esc(p.title) + '</b><a href="' + esc(p.name) + '/" target="_blank" rel="noopener">열기 ↗</a></div>';
  h += '<div class="sub">' + esc(p.name) + '</div>';
  if (p.err) return h + '<p class="err">' + esc(p.err) + '</p></div>';
  if (p.kind === 'request') {
    var rs = Object.keys(p.reqs || {}).map(function (k) { return p.reqs[k] }).sort(function (a, b) { return (b.at || 0) - (a.at || 0) });
    var c = { new: 0, doing: 0, done: 0 }; rs.forEach(function (r) { c[r.status || 'new'] = (c[r.status || 'new'] || 0) + 1 });
    h += '<div class="nums"><span class="' + (c.new ? 'hot' : 'new') + '"><b>' + c.new + '</b> 새 요청</span><span><b>' + c.doing + '</b> 하는 중</span><span><b>' + c.done + '</b> 끝</span></div>';
    var open = rs.filter(function (r) { return r.status !== 'done' }).slice(0, 4);
    h += open.length ? '<ul>' + open.map(function (r) { return '<li><span class="t">' + esc(ago(r.at)) + '</span><span class="x">' + esc(cut(r.text, 70)) + (r.by ? ' <span class="sub">· ' + esc(r.by) + '</span>' : '') + '</span></li>' }).join('') + '</ul>' : '<p class="empty">✓ 남은 요청 없음</p>';
    return h + '</div>';
  }
  var qs = p.qs || [], a = p.ans || {};
  var has = function (q) { var x = a[q.id] || {}; return !!(x.answer || x.files) };
  var n = qs.filter(has).length, tot = qs.length, pct = tot ? Math.round(n / tot * 100) : 0;
  var last = qs.filter(has).map(function (q) { return { q: q, at: (a[q.id] || {}).at || 0 } }).sort(function (x, y) { return y.at - x.at });
  h += '<div class="bar' + (n === tot && tot ? ' full' : '') + '"><i style="width:' + pct + '%"></i></div>';
  h += '<div class="nums"><span><b>' + n + '</b>/' + tot + ' 답</span><span>' + (n === tot && tot ? '✓ 다 참' : '<b>' + (tot - n) + '</b> 남음') + '</span>' + (last[0] ? '<span>마지막 답 ' + esc(ago(last[0].at)) + '</span>' : '') + '</div>';
  var left = qs.filter(function (q) { return !has(q) }).slice(0, 3);
  if (left.length) h += '<ul>' + left.map(function (q) { return '<li><span class="t">' + esc(q.id) + ' 빈칸</span><span class="x">' + esc(cut(q.q, 60)) + '</span></li>' }).join('') + '</ul>';
  else if (last.length) h += '<ul>' + last.slice(0, 3).map(function (x) { return '<li><span class="t">' + esc(ago(x.at)) + '</span><span class="x">' + esc(x.q.id) + ' ' + esc(cut((a[x.q.id] || {}).answer || '첨부', 50)) + '</span></li>' }).join('') + '</ul>';
  return h + '</div>';
}

function render() {
  if (!pages) return;
  if (!pages.length) { $('app').innerHTML = '<p class="empty">아직 페이지가 없습니다.</p>'; return }
  var groups = {};
  pages.forEach(function (p) { var k = p.name.split('-')[0]; (groups[k] = groups[k] || []).push(p) });
  var names = projects.projects || {};
  $('app').innerHTML = Object.keys(groups).sort().map(function (k) {
    return '<h2>' + esc(names[k] || k) + ' <small>' + esc(k) + '-… · 페이지 ' + groups[k].length + '개</small></h2><div class="grid">' + groups[k].map(card).join('') + '</div>';
  }).join('');
  var d = new Date(); $('upd').textContent = d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0') + ' 기준';
}

function refresh() { return loadPages().then(render) }
$('again').addEventListener('click', function () { $('upd').textContent = '읽는 중…'; refresh() });
refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
