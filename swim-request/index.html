<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>팀준 요청</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #fff; --ink: #14213d; --sub: #5b6577; --line: #dde2ea;
    --navy: #1d3a6e; --done: #1f7a4d; --done-bg: #e7f4ec; --edit: #b45309; --edit-bg: #fdf1e2;
    --new: #1d4ed8; --new-bg: #e6eefc; --empty: #8a93a3; --red: #c62828; --yellow: #ffd23f;
    --tile: 88px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }
  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  header.top .in { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 700; }
  .ttl { cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .who { float: right; font-size: 13px; color: var(--sub); font-weight: 400; margin-top: 3px; }
  .who button { font-size: 13px; padding: 0 0 0 6px; border: 0; background: none; color: var(--sub); }
  .count { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); }
  .count b { color: var(--ink); }
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 6px 12px; font-size: 14px; color: var(--sub); }
  .seg button.on { background: var(--navy); color: #fff; }

  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--sub); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .card.c-new { border-left: 4px solid var(--new); }
  .card.c-doing { border-left: 4px solid var(--edit); }
  .card.c-done { border-left: 4px solid var(--done); }
  .head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .st { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 6px; flex: none; min-width: 5em; text-align: center; }
  .st.s-new { background: var(--new-bg); color: var(--new); }
  .st.s-doing { background: var(--edit-bg); color: var(--edit); }
  .st.s-done { background: var(--done-bg); color: var(--done); }
  .txt { white-space: pre-wrap; margin: 0; }
  .txt a { color: var(--navy); }
  textarea {
    width: 100%; min-height: 110px; font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical; background: #fff; color: var(--ink); display: block;
  }
  textarea:focus { outline: 2px solid var(--navy); outline-offset: 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 9px 16px; font-size: 15px; }
  .btn.main { background: var(--yellow); border-color: var(--yellow); font-weight: 600; }
  .btn.red { color: #fff; background: var(--red); border-color: var(--red); }
  .btn:disabled { opacity: .5; }
  .btn.send { min-width: 9.5em; }
  .row .push { margin-left: auto; }
  .warn { background: var(--edit-bg); color: var(--edit); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .msg { font-size: 13px; color: var(--sub); margin-top: 6px; min-height: 20px; }
  .msg.bad { color: var(--red); }
  .empty-all { text-align: center; color: var(--sub); padding: 32px 0; }
  .gate { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  .gate p { color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
  .drop { outline: 2px dashed var(--navy); outline-offset: 4px; }

  /* 첨부: 사진은 같은 크기 네모, 파일은 한 줄씩. 올리기 전·후 크기가 같다 */
  .att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .att:empty { display: none; }
  .att-img { position: relative; width: var(--tile); height: var(--tile); flex: none; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: #eef0f4; padding: 0; }
  .att-open { display: block; width: 100%; height: 100%; border: 0; padding: 0; background: none; }
  .att-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .att-file { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 40px 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: #f7f9fc; text-align: left; color: var(--ink); font-size: 14px; }
  .att-file .ext { flex: none; width: 40px; height: 36px; border-radius: 6px; background: var(--navy); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  .att-name { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; }
  .att-file .sz { display: block; font-size: 12px; color: var(--sub); }
  .att-x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; border-radius: 14px; padding: 0;
    background: rgba(20, 33, 61, .75); color: #fff; font-size: 15px; line-height: 28px; text-align: center; }
  .att-file .att-x { top: 50%; margin-top: -14px; }

  /* 크게 보기 */
  .viewer { position: fixed; inset: 0; z-index: 20; background: #0b1220; display: none; flex-direction: column; }
  .viewer.on { display: flex; }
  .vbar { display: flex; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); align-items: center; flex: none; }
  .vbar .btn { padding: 7px 12px; font-size: 14px; }
  .vbar .nm { flex: 1; min-width: 0; color: #c9d1de; font-size: 13px; }
  .vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; text-align: center; }
  .vbody img { display: block; margin: 0 auto; max-width: 100%; height: auto; background: #fff; }
  .vbody.real img { max-width: none; }
  .vbody p { color: #c9d1de; margin-top: 30vh; }

  /* 설정(제목 10번) */
  .sheet { position: fixed; inset: 0; z-index: 25; background: rgba(11, 18, 32, .5); display: none; align-items: flex-start; justify-content: center; overflow: auto; }
  .sheet.on { display: flex; }
  .sheet-in { background: #fff; width: 100%; max-width: 480px; margin: 24px 16px; border-radius: 14px; padding: 18px 16px; }
  .sheet-in { position: relative; }
  .sheet-in h3 { margin: 0 0 4px; font-size: 17px; padding-right: 44px; }
  .sheet-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 18px;
    background: #fff; color: var(--ink); font-size: 16px; padding: 0; line-height: 34px; text-align: center; }
  .sheet-in p { margin: 6px 0; font-size: 14px; color: var(--sub); }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .hours button { height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 14px; padding: 0; }
  .hours button.on { background: var(--navy); border-color: var(--navy); color: #fff; }
  .topic { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: #f7f9fc; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-all; color: var(--ink); }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="pick" multiple hidden>
<div class="viewer" id="viewer"></div>
<div class="sheet" id="sheet"></div>
<script type="module">
// 요청 페이지: 작업하다 생기는 요청(글 + 스크린샷·파일)을 받는다. 저장은 Firebase Realtime Database.
//   pages/<PAGE>/requests/<id> = { text, by, at, status: new|doing|done, files: { <fid>: { name, type, size, w, h, t(작은 사진) } } }
//   pages/<PAGE>/blobs/<fid>   = { d: 원본(data URL) }  ← 크게 볼 때만 불러온다
//   pages/<PAGE>/settings      = { hours: "9,18" }       ← 모아 받는 알림 시간(한국 시간, 정시). 제목을 10번 누르면 나오는 설정 화면에서 바꾼다
// 알림: 저장소의 .github/request_digest.py(GitHub Actions, 15분마다)가 정한 시간이 지나면 그사이 새 요청 수를 ntfy로 한 번 보낸다.
// 아래 값은 '새 질문 페이지.sh 요청'이 채운다.
var KIND = 'request';
var TITLE = '팀준 요청';
var PAGE = 'swim-request';
var DB_URL = 'https://question-pages-45aae-default-rtdb.asia-southeast1.firebasedatabase.app';
var NTFY = 'b9cebeb56f548330-swim-request';

var MAX_SIDE = 3000;              // 사진 긴 변 최대(px). 스크린샷은 원본 크기 그대로 두어 글자가 읽힌다
var MAX_FILE = 5 * 1024 * 1024;   // 사진이 아닌 파일 한 개 최대 크기
var MAX_FILES = 10;               // 요청 하나에 넣는 첨부 개수
var STATUS = { new: '새 요청', doing: '하는 중', done: '끝' };

var DEMO = /[?&]demo\b/.test(location.search);
var S = { name: '', reqs: {}, live: false, filter: 'open', text: '', files: [], busy: '', err: '', admin: false, hours: '', sheetHours: null };
var $app = document.getElementById('app'), $pick = document.getElementById('pick'), $viewer = document.getElementById('viewer'), $sheet = document.getElementById('sheet');
var fb = null;

function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }); }
function me() { return S.name || '익명'; }
function ago(t) {
  if (!t) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  var h = Math.round(m / 60);
  if (h < 24) return h + '시간 전';
  var d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toast(t) {
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2500);
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
function hourList(s) { return String(s || '').split(',').filter(Boolean).map(Number).filter(function (h) { return h >= 0 && h < 24; }).sort(function (a, b) { return a - b; }); }

// ---------- 첨부 만들기 ----------
function loadImg(src) { return new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = src; }); }
function readUrl(blob) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = no; r.readAsDataURL(blob); }); }
function encode(img, w, h, q) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
// 사진: 긴 변 MAX_SIDE까지 원본 크기, JPEG 0.92(너무 크면 0.82). 목록용 작은 사진(t)은 짧은 변 200px.
// 사진이 아닌 파일: 그대로(MAX_FILE까지).
async function prep(file) {
  if (/^image\//.test(file.type) && !/svg|gif/.test(file.type)) {
    try {
      var u = URL.createObjectURL(file), img = await loadImg(u); URL.revokeObjectURL(u);
      var w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, MAX_SIDE / Math.max(w, h), Math.sqrt(16e6 / (w * h)));
      var cw = Math.round(w * k), ch = Math.round(h * k);
      var d = encode(img, cw, ch, 0.92);
      if (d.length > 6.5e6) d = encode(img, cw, ch, 0.82);
      // 작은 사진은 규칙 한도(4만 자) 안에 들 때까지 화질 → 크기 순으로 낮춘다
      var t = '', side = 200;
      for (var tries = 0; tries < 8 && (!t || t.length > 36000); tries++) {
        var tk = Math.min(1, side / Math.min(w, h), side * 3 / Math.max(w, h));
        t = encode(img, Math.max(1, Math.round(w * tk)), Math.max(1, Math.round(h * tk)), [0.7, 0.55, 0.4][tries % 3]);
        if (tries % 3 === 2) side = Math.round(side * 0.75);
      }
      var nm = (file.name || '사진').replace(/\.[^.]+$/, '') + '.jpg';
      return { id: newId(), d: d, meta: { name: nm.slice(0, 200), type: 'image/jpeg', size: Math.round(d.length * 3 / 4), w: cw, h: ch, t: t } };
    } catch (e) { /* 그림으로 못 읽으면 파일로 둔다 */ }
  }
  if (file.size > MAX_FILE) throw new Error('"' + file.name + '"은 ' + kb(file.size) + '라 넣을 수 없어요(파일은 ' + kb(MAX_FILE) + '까지)');
  return { id: newId(), d: await readUrl(file), meta: { name: (file.name || '파일').slice(0, 200), type: (file.type || 'application/octet-stream').slice(0, 100), size: file.size } };
}
async function addFiles(list) {
  list = Array.prototype.slice.call(list || []);
  if (!list.length) return;
  if (S.files.length + list.length > MAX_FILES) { S.err = '첨부는 요청 하나에 ' + MAX_FILES + '개까지예요'; render(); return; }
  S.err = ''; S.busy = 'prep'; render();
  for (var i = 0; i < list.length; i++) {
    try { S.files.push(await prep(list[i])); } catch (e) { S.err = e.message; }
  }
  S.busy = ''; render();
}

// ---------- 첨부 보이기 ----------
function ext(m) { var x = /\.([a-z0-9]{1,5})$/i.exec(m.name || ''); return x ? x[1] : (m.type.split('/')[1] || '파일').slice(0, 5); }
function isImg(m) { return /^image\//.test(m.type) && m.t; }
// files: [{id, meta}] · draft면 지우기(✕) 단추
function attHtml(files, owner, draft) {
  var imgs = '', docs = '';
  files.forEach(function (f) {
    var m = f.meta, x = draft ? '<button class="att-x" data-act="unattach" data-f="' + f.id + '" aria-label="빼기">✕</button>' : '';
    var key = ' data-f="' + f.id + '" data-o="' + owner + '"';
    if (isImg(m)) imgs += '<span class="att-img"><button class="att-open" data-act="view"' + key + ' aria-label="크게 보기"><img src="' + m.t + '" alt=""></button>' + x + '</span>';
    else docs += '<span class="att-file"><span class="ext">' + esc(ext(m)) + '</span><button class="att-name" data-act="view"' + key + '>' + esc(m.name) + '<span class="sz">' + kb(m.size) + ' · 눌러서 열기</span></button>' + x + '</span>';
  });
  return '<div class="att">' + imgs + docs + '</div>';
}

var cache = {}; // fid → object URL
async function blobUrl(fid) {
  if (cache[fid]) return cache[fid];
  var d = DEMO ? demo.blobs[fid] : await fb.getBlob(fid);
  if (!d) throw new Error('파일을 찾지 못했어요');
  var b = await (await fetch(d)).blob();
  return (cache[fid] = URL.createObjectURL(b));
}
function findFile(owner, fid) {
  if (owner === 'draft') { var f = S.files.filter(function (x) { return x.id === fid; })[0]; return f && { meta: f.meta, d: f.d }; }
  var r = S.reqs[owner]; return r && r.files && r.files[fid] ? { meta: r.files[fid] } : null;
}
async function view(owner, fid) {
  var f = findFile(owner, fid); if (!f) return;
  var m = f.meta;
  if (!isImg(m)) {
    // 사진이 아닌 파일: 새 탭에서 연다(PDF는 브라우저가 미리 보여 줌). 창은 누른 순간 열어 둬야 막히지 않는다
    var w = window.open('', '_blank');
    try {
      var u = f.d ? URL.createObjectURL(await (await fetch(f.d)).blob()) : await blobUrl(fid);
      if (w) w.location.href = u; else location.href = u;
    } catch (e) { if (w) w.close(); toast(e.message); }
    return;
  }
  $viewer.innerHTML = '<div class="vbar"><button class="btn" data-v="close">닫기</button><span class="nm">' + esc(m.name) + (m.w ? ' · ' + m.w + '×' + m.h : '') +
    '</span><button class="btn" data-v="real">실제 크기</button><a class="btn" data-v="save" download="' + esc(m.name) + '">받기</a></div><div class="vbody"><p>불러오는 중…</p></div>';
  $viewer.classList.add('on'); document.body.style.overflow = 'hidden';
  try {
    var src = f.d ? f.d : await blobUrl(fid);
    if (!$viewer.classList.contains('on')) return;
    $viewer.querySelector('.vbody').innerHTML = '<img src="' + src + '" alt="">';
    $viewer.querySelector('[data-v="save"]').href = src;
  } catch (e) { $viewer.querySelector('.vbody').innerHTML = '<p>' + esc(e.message) + '</p>'; }
}
$viewer.addEventListener('click', function (e) {
  var b = e.target.closest('[data-v]'); if (!b) return;
  if (b.dataset.v === 'close') { $viewer.classList.remove('on'); $viewer.innerHTML = ''; document.body.style.overflow = ''; }
  else if (b.dataset.v === 'real') { var v = $viewer.querySelector('.vbody'); v.classList.toggle('real'); b.textContent = v.classList.contains('real') ? '화면에 맞춤' : '실제 크기'; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $viewer.classList.contains('on')) $viewer.querySelector('[data-v="close"]').click(); });

// ---------- 저장소(Firebase) ----------
async function connect() {
  if (DEMO) return demoConnect();
  var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var app = await import(base + 'firebase-app.js');
  var d = await import(base + 'firebase-database.js');
  var db = d.getDatabase(app.initializeApp({ databaseURL: DB_URL }));
  var R = function (p) { return d.ref(db, 'pages/' + PAGE + '/' + p); };
  fb = {
    putBlob: function (fid, data) { return d.set(R('blobs/' + fid), { d: data }); },
    getBlob: function (fid) { return d.get(R('blobs/' + fid + '/d')).then(function (s) { return s.val(); }); },
    delBlob: function (fid) { return d.remove(R('blobs/' + fid)).catch(function () {}); },
    putReq: function (id, v) { return d.set(R('requests/' + id), v); },
    setStatus: function (id, st) { return d.set(R('requests/' + id + '/status'), st); },
    delReq: function (id) { return d.remove(R('requests/' + id)); },
    setHours: function (h) { return d.set(R('settings/hours'), h); }
  };
  d.onValue(R('requests'), function (s) { S.reqs = s.val() || {}; S.live = true; render(); },
    function (err) { toast('요청을 불러오지 못했습니다: ' + err.message); });
  d.onValue(R('settings/hours'), function (s) { S.hours = s.val() || ''; });
}

async function send() {
  var text = S.text.trim();
  if (!text && !S.files.length) { S.err = '요청 내용을 적거나 스크린샷을 넣어 주세요'; render(); return; }
  S.err = ''; var files = {}, n = S.files.length;
  try {
    for (var i = 0; i < n; i++) {
      S.busy = '올리는 중 ' + (i + 1) + '/' + n; render();
      var f = S.files[i];
      if (DEMO) demo.blobs[f.id] = f.d; else await fb.putBlob(f.id, f.d);
      files[f.id] = f.meta;
    }
    S.busy = '보내는 중'; render();
    var v = { text: text, by: me(), at: Date.now(), status: 'new' };
    if (n) v.files = files;
    var id = newId();
    if (DEMO) demo.put(id, v); else await fb.putReq(id, v);
    S.text = ''; S.files = []; store('rq_draft', null); S.busy = ''; render();
    toast('요청을 보냈습니다');
  } catch (e) {
    S.busy = ''; S.err = '보내지 못했어요: ' + (e && e.message || '인터넷 연결을 확인해 주세요'); render();
  }
}

// ---------- 화면 ----------
function render() {
  var act = document.activeElement, focused = act && act.id === 'rq-text', sel = focused ? [act.selectionStart, act.selectionEnd] : null;
  var y = window.scrollY;
  var all = Object.keys(S.reqs).map(function (k) { return Object.assign({ id: k }, S.reqs[k]); }).sort(function (a, b) { return (b.at || 0) - (a.at || 0); });
  var c = { new: 0, doing: 0, done: 0 };
  all.forEach(function (r) { c[r.status in c ? r.status : 'new']++; });

  var h = '<header class="top"><div class="in">';
  h += '<h1><span class="ttl" data-act="title">' + esc(TITLE) + '</span> <span class="who">' + (S.name ? esc(S.name) + '<button data-act="rename">이름 바꾸기</button>' : '<button data-act="rename">이름 넣기</button>') + '</span></h1>';
  h += '<div class="count"><span>남은 요청 <b>' + (c.new + c.doing) + '</b> · 끝 ' + c.done + '</span>';
  h += '<span class="seg"><button data-act="filter" data-v="open" class="' + (S.filter === 'open' ? 'on' : '') + '">남은 것</button>';
  h += '<button data-act="filter" data-v="all" class="' + (S.filter === 'all' ? 'on' : '') + '">전체</button></span></div>';
  h += '</div></header><div class="wrap">';

  // 새 요청 쓰기
  var busy = !!S.busy;
  h += '<h2>새 요청</h2><div class="card" id="rq-form">';
  h += '<textarea id="rq-text" placeholder="바꾸거나 더하면 좋을 것을 적어 주세요. 스크린샷을 같이 넣으면 빨리 알아볼 수 있어요.">' + esc(S.text) + '</textarea>';
  h += attHtml(S.files, 'draft', !busy);
  h += '<div class="row"><button class="btn" data-act="attach"' + (busy ? ' disabled' : '') + '>사진·파일 넣기</button>';
  h += '<button class="btn main send push" data-act="send"' + (busy ? ' disabled' : '') + '>' + (S.busy === 'prep' ? '사진 준비 중' : (S.busy || '요청 보내기')) + '</button></div>';
  h += '<div class="msg' + (S.err ? ' bad' : '') + '">' + esc(S.err || '컴퓨터에서는 스크린샷을 이 칸에 붙여 넣거나(⌘V) 끌어다 놓아도 돼요.') + '</div>';
  h += '</div>';

  // 목록
  var list = all.filter(function (r) { return S.filter === 'all' || r.status !== 'done'; });
  h += '<h2>' + (S.filter === 'all' ? '모든 요청' : '남은 요청') + '</h2>';
  if (!S.live) h += '<div class="warn">요청을 불러오는 중입니다…</div>';
  else if (!list.length) h += '<div class="empty-all">' + (all.length ? '남은 요청이 없습니다.' : '아직 요청이 없습니다.') + '</div>';
  list.forEach(function (r) { h += card(r); });
  h += '</div>';

  $app.innerHTML = h;
  window.scrollTo(0, y);
  if (focused) { var t = document.getElementById('rq-text'); t.focus({ preventScroll: true }); try { t.setSelectionRange(sel[0], sel[1]); } catch (e) {} }
}

function card(r) {
  var st = r.status in STATUS ? r.status : 'new';
  var h = '<div class="card c-' + st + '" id="r-' + r.id + '">';
  h += '<div class="head"><span class="st s-' + st + '">' + STATUS[st] + '</span><span>' + esc(r.by || '익명') + ' · ' + ago(r.at) + '</span></div>';
  if (r.text) h += '<p class="txt">' + linkify(r.text) + '</p>';
  var files = Object.keys(r.files || {}).map(function (k) { return { id: k, meta: r.files[k] }; });
  if (files.length) h += attHtml(files, r.id, false);
  if (S.admin) {
    h += '<div class="row"><span class="seg">';
    ['new', 'doing', 'done'].forEach(function (k) { h += '<button data-act="status" data-id="' + r.id + '" data-v="' + k + '" class="' + (st === k ? 'on' : '') + '">' + STATUS[k] + '</button>'; });
    h += '</span><button class="btn red push" data-act="del" data-id="' + r.id + '">지우기</button></div>';
  }
  return h + '</div>';
}

// ---------- 설정(제목을 10번 누르면) ----------
var taps = 0, lastTap = 0;
function openSheet() {
  S.admin = true; store('rq_admin', '1'); render();
  S.sheetHours = hourList(S.hours);
  drawSheet(); $sheet.classList.add('on');
}
function drawSheet(msg) {
  var hs = S.sheetHours, h = '<div class="sheet-in"><button class="sheet-x" data-s="close" aria-label="닫기">✕</button><h3>알림 시간</h3>';
  h += '<p>고른 시간(한국 시간, 정시)마다 그사이 들어온 새 요청 수를 휴대폰으로 한 번에 보냅니다. 새 요청이 없으면 보내지 않습니다. GitHub이 15분마다 확인하므로 정한 시간보다 15분쯤(붐비면 더) 늦게 올 수 있습니다.</p>';
  h += '<div class="hours">';
  for (var i = 0; i < 24; i++) h += '<button data-s="hour" data-v="' + i + '" class="' + (hs.indexOf(i) >= 0 ? 'on' : '') + '">' + i + '시</button>';
  h += '</div><p>' + (hs.length ? '지금 고른 시간: 매일 ' + hs.map(function (x) { return x + '시'; }).join(' · ') : '고른 시간이 없어 알림이 가지 않습니다.') + '</p>';
  h += '<div class="row"><button class="btn main" data-s="save">저장</button><button class="btn" data-s="test">시험 알림 보내기</button><button class="btn push" data-s="close">닫기</button></div>';
  h += '<div class="msg">' + esc(msg || '') + '</div>';
  h += '<p style="margin-top:14px">휴대폰 ntfy 앱에서 아래 주제를 구독하면 알림을 받습니다.</p><div class="topic">' + esc(NTFY) + '</div>';
  h += '<p style="margin-top:14px">이 기기에서는 요청마다 상태 바꾸기·지우기 단추가 보입니다.</p><div class="row"><button class="btn" data-s="off">이 기기에서 관리 단추 숨기기</button></div>';
  $sheet.innerHTML = h + '</div>';
}
$sheet.addEventListener('click', function (e) {
  var b = e.target.closest('[data-s]'); if (!b) return;
  var s = b.dataset.s;
  if (s === 'hour') {
    var v = +b.dataset.v, i = S.sheetHours.indexOf(v);
    if (i >= 0) S.sheetHours.splice(i, 1); else S.sheetHours.push(v);
    S.sheetHours.sort(function (a, b) { return a - b; }); drawSheet();
  } else if (s === 'save') {
    var val = S.sheetHours.join(',');
    (DEMO ? Promise.resolve(demo.settings.hours = val) : fb.setHours(val))
      .then(function () { S.hours = val; drawSheet('저장했습니다'); })
      .catch(function (err) { drawSheet('저장하지 못했어요: ' + err.message); });
  } else if (s === 'test') {
    if (DEMO || !NTFY) { drawSheet('시험 화면에서는 보내지 않습니다'); return; }
    fetch('https://ntfy.sh/' + NTFY, { method: 'POST', body: TITLE + ': 시험 알림입니다', headers: { Tags: 'bell', Click: location.href.split('?')[0] } })
      .then(function () { drawSheet('보냈습니다. 휴대폰을 확인해 주세요'); }).catch(function () { drawSheet('보내지 못했어요'); });
  } else if (s === 'off') {
    S.admin = false; store('rq_admin', null); $sheet.classList.remove('on'); render();
  } else if (s === 'close') { $sheet.classList.remove('on'); }
});

// ---------- 누르기 ----------
$app.addEventListener('input', function (e) {
  if (e.target.id === 'rq-text') { S.text = e.target.value; store('rq_draft', S.text || null); }
});
$app.addEventListener('paste', function (e) {
  var fs = e.clipboardData && e.clipboardData.files;
  if (fs && fs.length && e.target.id === 'rq-text') { e.preventDefault(); addFiles(fs); }
});
$app.addEventListener('dragover', function (e) { if (e.target.closest('#rq-form')) { e.preventDefault(); e.target.closest('#rq-form').classList.add('drop'); } });
$app.addEventListener('dragleave', function (e) { var f = e.target.closest('#rq-form'); if (f) f.classList.remove('drop'); });
$app.addEventListener('drop', function (e) { var f = e.target.closest('#rq-form'); if (f) { e.preventDefault(); f.classList.remove('drop'); addFiles(e.dataTransfer.files); } });
$pick.addEventListener('change', function () { var fs = $pick.files; addFiles(fs).then(function () { $pick.value = ''; }); });

$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === 'title') {
    var now = Date.now(); taps = now - lastTap < 1500 ? taps + 1 : 1; lastTap = now;
    if (taps >= 10) { taps = 0; openSheet(); }
  } else if (act === 'rename') {
    var n = window.prompt('이름 (요청 옆에 표시돼요. 비우면 익명)', S.name);
    if (n !== null) { S.name = n.trim().slice(0, 30); store('qp_name', S.name || null); render(); }
  } else if (act === 'filter') {
    S.filter = b.dataset.v; render();
  } else if (act === 'attach') {
    $pick.click();
  } else if (act === 'unattach') {
    S.files = S.files.filter(function (f) { return f.id !== b.dataset.f; }); S.err = ''; render();
  } else if (act === 'send') {
    send();
  } else if (act === 'view') {
    view(b.dataset.o, b.dataset.f);
  } else if (act === 'status') {
    var v = b.dataset.v;
    if (DEMO) demo.status(id, v); else fb.setStatus(id, v).catch(function (err) { toast('바꾸지 못했어요: ' + err.message); });
  } else if (act === 'del') {
    if (!window.confirm('이 요청을 지울까요? 넣은 사진·파일도 함께 지워지고 되돌릴 수 없습니다.')) return;
    var fids = Object.keys((S.reqs[id] || {}).files || {});
    if (DEMO) { demo.del(id); return; }
    fb.delReq(id).then(function () { fids.forEach(fb.delBlob); toast('지웠습니다'); }).catch(function (err) { toast('지우지 못했어요: ' + err.message); });
  }
});

// 1분마다 다시 그려 '3분 전' 같은 시간을 새로 맞춘다(쓰는 중이면 건너뜀)
setInterval(function () { if (!S.busy && document.activeElement && document.activeElement.id !== 'rq-text') render(); }, 60000);

// ---------- 시험용 가짜 저장소 (?demo) ----------
var demo = null;
function demoConnect() {
  var db = {
    a1: { text: '회원명단에서 연락처가 잘려 보여요. 아래 스크린샷 참고해 주세요.', by: '홍길동', at: Date.now() - 3 * 3600000, status: 'new' },
    a2: { text: '일정 화면 글씨를 조금 더 크게 해 주세요', by: '김철수', at: Date.now() - 26 * 3600000, status: 'doing' },
    a3: { text: '끝난 요청 예시', by: '익명', at: Date.now() - 50 * 3600000, status: 'done' }
  };
  function push() { S.reqs = JSON.parse(JSON.stringify(db)); S.live = true; render(); }
  demo = {
    blobs: {}, settings: { hours: '9,18' },
    put: function (id, v) { db[id] = v; push(); },
    status: function (id, v) { db[id].status = v; push(); },
    del: function (id) { delete db[id]; push(); }
  };
  S.hours = '9,18';
  setTimeout(push, 100);
}

// ---------- 시작 ----------
S.name = load('qp_name'); S.text = load('rq_draft'); S.admin = load('rq_admin') === '1';
render();
connect().catch(function (err) { $app.innerHTML = '<div class="gate"><p>불러오지 못했습니다: ' + esc(err && err.message) + '</p></div>'; });
window.__rq = { S: S, demo: function () { return demo; }, addFiles: addFiles }; // 점검용
</script>
</body>
</html>
