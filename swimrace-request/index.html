<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>수영 분석 프로그램 요청</title>
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js">
<link rel="modulepreload" href="https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js">
<style>
  :root {
    --bg: #eef3ef; --card: #fff; --ink: #16261d; --sub: #56655c; --line: #dde7e0; --tint: #f2f5f3;
    --accent: #22704a; --accent-soft: #8cc4a2;
    --warn: #8a4b0f; --warn-bg: #fbf3e6; --red: #c62828;
    --new: #3f4944; --new-bg: #eaefec; --doing: #17633c; --doing-bg: #dff0e5; --done: #5f6964; --done-bg: #f3f5f4;
    --edit: var(--warn); --edit-bg: var(--warn-bg); --empty: #6b7570;
    --tile: 88px;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 16px/1.55 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", "Malgun Gothic", sans-serif;
    word-break: keep-all; overflow-wrap: anywhere;
  }
  .wrap { max-width: 640px; margin: 0 auto; padding: 0 16px 96px; }
  header.top {
    position: sticky; top: 0; z-index: 5; background: var(--bg);
    padding: 12px 16px 8px; border-bottom: 1px solid var(--line);
  }
  header.top .in { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 18px; margin: 0 0 8px; font-weight: 700; }
  .ttl { cursor: default; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  .who { float: right; font-size: 13px; color: var(--sub); font-weight: 400; margin-top: 3px; }
  .who button { font-size: 13px; padding: 0 0 0 6px; border: 0; background: none; color: var(--sub); }
  .count { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 14px; color: var(--sub); }
  .count b { color: var(--ink); }
  .seg { display: inline-flex; flex: none; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--card); }
  .seg button { border: 0; background: none; padding: 6px 12px; font-size: 14px; color: var(--sub); }
  .seg button.on { background: var(--accent); color: #fff; }

  h2 { font-size: 15px; margin: 24px 0 8px; color: var(--sub); font-weight: 600; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
  .head { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--sub); margin-bottom: 6px; }
  .st { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 6px; flex: none; width: 5em; text-align: center; white-space: nowrap; }
  .st.s-new { background: var(--new-bg); color: var(--new); }
  .st.s-doing { background: var(--edit-bg); color: var(--edit); }
  .st.s-done { background: var(--done-bg); color: var(--done); }
  .scr { font-size: 12px; padding: 1px 8px; border-radius: 6px; border: 1px solid var(--line); color: var(--sub); white-space: nowrap; flex: none; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .chips button { height: 32px; padding: 0 12px; border: 1px solid var(--line); border-radius: 99px; background: #fff; color: var(--sub); font-size: 13px; }
  .chips button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .seen { display: flex; align-items: center; gap: 8px; margin-top: 8px; font-size: 13px; color: var(--sub); min-height: 36px; }
  .seen .btn { min-width: 7.5em; height: 36px; min-height: 36px; }
  .txt { white-space: pre-wrap; margin: 0; }
  .md { white-space: normal; }
  div.md p, div.md ul, div.md ol, div.md blockquote, div.md h4 { margin: 0 0 10px; white-space: normal; }   /* div.md: .note p 같은 앞 규칙보다 이기게 */
  div.md > :last-child { margin-bottom: 0; }
  .md ul, .md ol { padding-left: 1.4em; }
  .md li { margin: 2px 0; }
  .md h4 { font-size: 15px; }
  .md blockquote { border-left: 3px solid var(--line); padding-left: 10px; color: var(--sub); }
  .md code { background: rgba(0,0,0,.06); border-radius: 4px; padding: 0 4px; font-size: .92em; }
  .md hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
  .txt a { color: var(--accent); }
  .reply { margin-top: 10px; background: var(--tint); border-left: 3px solid var(--accent-soft); border-radius: 0 8px 8px 0; padding: 8px 12px; }
  .reply .rh { font-size: 13px; color: var(--sub); margin-bottom: 2px; }
  .reply .rh b { color: var(--accent); }
  .reply p { margin: 0; white-space: pre-wrap; }
  .reply-edit { margin-top: 10px; }
  .ebtn { margin-left: auto; flex: none; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 6px; padding: 2px 10px; font-size: 13px; }
  .ebtn:disabled { opacity: .5; }
  .adm .btn { padding: 6px 12px; font-size: 14px; min-height: 36px; }
  .adm .rbtn { min-width: 4.2em; }
  .reply-edit textarea { min-height: 80px; }
  textarea {
    width: 100%; min-height: 110px; font: inherit; font-size: 16px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 8px; resize: vertical; background: #fff; color: var(--ink); display: block;
  }
  textarea:focus { outline: 2px solid var(--accent); outline-offset: 0; }
  .row { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; align-items: center; }
  button { font: inherit; cursor: pointer; }
  .btn { border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 8px; padding: 9px 16px; font-size: 15px; }
  .btn.red { color: #fff; background: var(--red); border-color: var(--red); }
  .btn:disabled { opacity: .5; }
  .btn.send { min-width: 9.5em; }
  .row .push { margin-left: auto; }
  .warn { background: var(--edit-bg); color: var(--edit); border-radius: 8px; padding: 10px 12px; font-size: 14px; margin-top: 8px; }
  .msg { font-size: 13px; color: var(--sub); margin-top: 6px; min-height: 20px; }
  .msg.bad { color: var(--red); }
  .empty-all { text-align: center; color: var(--sub); padding: 32px 0; }
  .gate { max-width: 360px; margin: 18vh auto 0; padding: 0 16px; }
  .gate p { color: var(--sub); }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--ink); color: #fff;
    padding: 10px 16px; border-radius: 8px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
  .drop { outline: 2px dashed var(--accent); outline-offset: 4px; }

  /* 첨부: 사진은 같은 크기 네모, 파일은 한 줄씩. 올리기 전·후 크기가 같다 */
  .att { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .att:empty { display: none; }
  .att-img { position: relative; width: var(--tile); height: var(--tile); flex: none; border: 1px solid var(--line); border-radius: 8px;
    overflow: hidden; background: #eef2ef; padding: 0; }
  .att-open { display: block; width: 100%; height: 100%; border: 0; padding: 0; background: none; }
  .att-img img { width: 100%; height: 100%; object-fit: cover; object-position: top; display: block; }
  .att-file { position: relative; display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 8px 40px 8px 10px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--tint); text-align: left; color: var(--ink); font-size: 14px; }
  .att-file .ext { flex: none; width: 40px; height: 36px; border-radius: 6px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center; text-transform: uppercase; }
  .att-name { flex: 1; min-width: 0; border: 0; background: none; padding: 0; text-align: left; color: inherit; font: inherit; }
  .att-file .sz { display: block; font-size: 12px; color: var(--sub); }
  .att-x { position: absolute; top: 4px; right: 4px; width: 28px; height: 28px; border: 0; border-radius: 14px; padding: 0;
    background: rgba(22, 38, 29, .75); color: #fff; font-size: 15px; line-height: 28px; text-align: center; }
  .att-file .att-x { top: 50%; margin-top: -14px; }

  /* 크게 보기 */
  .viewer { position: fixed; inset: 0; z-index: 20; background: #0b1220; display: none; flex-direction: column; }
  .viewer.on { display: flex; }
  .vbar { display: flex; gap: 8px; padding: 10px 12px; padding-top: max(10px, env(safe-area-inset-top)); align-items: center; flex: none; }
  .vbar .btn { padding: 7px 12px; font-size: 14px; min-height: 36px; }
  .vbar .nm { flex: 1; min-width: 0; color: #c9d1de; font-size: 13px; }
  .vbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; text-align: center; }
  .vbody img { display: block; margin: 0 auto; max-width: 100%; height: auto; background: #fff; }
  .vbody.real img { max-width: none; }
  .vbody p { color: #c9d1de; margin-top: 30vh; }

  /* 설정(제목 10번) */
  .sheet { position: fixed; inset: 0; z-index: 25; background: rgba(11, 18, 32, .5); display: none; align-items: flex-start; justify-content: center; overflow: auto; }
  .sheet.on { display: flex; }
  .sheet-in { background: #fff; width: 100%; max-width: 480px; margin: 24px 16px; border-radius: 14px; padding: 18px 16px; }
  .sheet-in { position: relative; }
  .sheet-in h3 { margin: 0 0 4px; font-size: 17px; padding-right: 44px; }
  .sheet-x { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 18px;
    background: #fff; color: var(--ink); font-size: 16px; padding: 0; line-height: 34px; text-align: center; }
  .sheet-in p { margin: 6px 0; font-size: 14px; color: var(--sub); }
  .hours { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; margin: 10px 0; }
  .hours button { height: 40px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 14px; padding: 0; }
  .hours button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .note { background: var(--card); border: 1px solid var(--line); border-left: 3px solid var(--accent-soft); border-radius: 12px; padding: 12px 16px; margin-top: 16px; }
  .note .nh { font-size: 13px; color: var(--sub); font-weight: 600; margin-bottom: 2px; }
  .note p { margin: 0; white-space: pre-wrap; }
  .note a { color: var(--accent); }
  .pd { font-size: 12px; font-weight: 400; color: var(--sub); margin-left: 6px; white-space: nowrap; }   /* 수정 기간: 제목 옆 작게(2026-11-20 저자 '잘 안 보이게, 정 없다') */
  details.note summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 8px; }
  details.note summary::-webkit-details-marker { display: none; }
  details.note .nh { margin: 0; flex: none; }
  details.note .nprev { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 14px; }
  details.note .nmore { flex: none; font-size: 12px; color: var(--sub); }
  details.note[open] .nprev { visibility: hidden; }
  details.note .md { margin-top: 8px; }
  .sheet-in textarea { min-height: 90px; }
  .sheet-in .msg { min-height: 42px; }   /* 시험 알림 결과(두 줄까지)가 떠도 아래 글이 밀리지 않게 */
  .topic { font-family: ui-monospace, Menlo, monospace; font-size: 13px; background: var(--tint); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; word-break: break-all; color: var(--ink); }

  /* 조용한 유리(2026-11-20 저자 'B로'): 유리는 위 머리줄에만. 투명 줄이기 설정·못 그리는 브라우저는 단색 */
  header.top { background: rgba(238, 243, 239, .74); -webkit-backdrop-filter: blur(16px) saturate(140%); backdrop-filter: blur(16px) saturate(140%); border-bottom: 1px solid rgba(22, 38, 29, .07); }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) { header.top { background: var(--bg); } }
  @media (prefers-reduced-transparency: reduce) { header.top { background: var(--bg); -webkit-backdrop-filter: none; backdrop-filter: none; } }
  /* 단추: 글자는 늘 가운데(가로·세로) */
  .btn { display: inline-flex; align-items: center; justify-content: center; text-align: center; min-height: 42px; line-height: 1.3; border-radius: 10px; }
  .btn.main { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .card { border: 1px solid rgba(22, 38, 29, .05); border-radius: 14px; box-shadow: 0 1px 2px rgba(16, 48, 30, .06), 0 2px 8px rgba(16, 48, 30, .04); }
  .warn { background: var(--warn-bg); color: var(--warn); }
  .warn.wait { background: var(--tint); color: var(--sub); }
  .st.s-doing { background: var(--doing-bg); color: var(--doing); font-weight: 600; }
  .st.s-done::before { content: "✓ "; }
  /* 불러오는 동안(2026-11-22 저자 "로딩중 이펙트"): 0.15초 안에 다 오면 아예 안 보이고, 늦을 때만 돌이 + 빈 카드가 반짝인다 */
  .loading { max-width: 640px; margin: 0 auto; padding: 28px 16px 0; animation: ldin .25s .15s both; }
  .ld-head { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--sub); font-size: 14px; margin-bottom: 18px; }
  .spin { width: 16px; height: 16px; border: 2px solid rgba(34, 112, 74, .18); border-top-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; flex: none; }
  .sk { border-radius: 14px; border: 1px solid rgba(22, 38, 29, .05); margin-bottom: 12px; background: linear-gradient(90deg, rgba(255,255,255,.5) 25%, rgba(255,255,255,.95) 50%, rgba(255,255,255,.5) 75%); background-size: 200% 100%; animation: shim 1.3s ease-in-out infinite; }
  .sk.h1 { height: 120px; } .sk.h2 { height: 150px; } .sk.h3 { height: 96px; }
  @keyframes ldin { from { opacity: 0; } to { opacity: 1; } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes shim { from { background-position: 100% 0; } to { background-position: -100% 0; } }
  @media (prefers-reduced-motion: reduce) { .spin, .sk { animation: none; } }
</style>
</head>
<body>
<div id="app"></div>
<input type="file" id="pick" multiple hidden>
<div class="viewer" id="viewer"></div>
<div class="sheet" id="sheet"></div>
<script type="module">
// 요청 페이지: 작업하다 생기는 요청(글 + 스크린샷·파일)을 받는다. 저장은 Firebase Realtime Database.
//   pages/<PAGE>/requests/<id> = { text, by, at, status: new|doing|done, screen(고른 화면 이름), seen: { by, at }(끝난 요청을 쓴 쪽이 '확인했어요' 누름), reply: { text, at }(처리 답글, 관리 기기에서만 씀), files: { <fid>: { name, type, size, w, h, t(작은 사진) } } }
//   pages/<PAGE>/blobs/<fid>   = { d: 원본(data URL) }  ← 크게 볼 때만 불러온다
//   pages/<PAGE>/settings      = { hours: "9,18", note, until } (until: 수정 기간이 끝나는 때, 밀리초. 2026-11-20 저자 '한 달 수정 타이머') ← 모아 받는 알림 시간(한국 시간, 정시)과 맨 위 한마디. 제목을 10번 누르면 나오는 설정 화면에서 바꾼다
// 알림: 저장소의 .github/request_digest.py(맥 launchd 1분마다 + GitHub Actions 15분마다 대신)가 정한 시간이 지나면 그사이 들어온, 아직 '새 요청'인 것의 수를 ntfy로 한 번 보낸다.
// 아래 값은 '새 질문 페이지.sh 요청'이 채운다.
var KIND = 'request';
var TITLE = '수영 분석 프로그램 요청';
var PAGE = 'swimrace-request';
var DB_URL = 'https://question-pages-45aae-default-rtdb.asia-southeast1.firebasedatabase.app';
var NTFY = 'b9cebeb56f548330-swimrace-request';

var MAX_SIDE = 3000;              // 사진 긴 변 최대(px). 스크린샷은 원본 크기 그대로 두어 글자가 읽힌다
var MAX_FILE = 5 * 1024 * 1024;   // 사진이 아닌 파일 한 개 최대 크기
var MAX_FILES = 10;               // 요청 하나에 넣는 첨부 개수
var STATUS = { new: '새 요청', doing: '하는 중', done: '끝' };

var DEMO = /[?&]demo\b/.test(location.search);
var LOADING = '<div class="loading" role="status" aria-live="polite"><div class="ld-head"><span class="spin"></span>불러오는 중…</div><div class="sk h1"></div><div class="sk h2"></div><div class="sk h3"></div></div>';
var S = { got: {}, slow: false, ed: {}, mine: [], note: '', sheetNote: '', rOpen: {}, rDraft: {}, rBusy: {}, name: '', reqs: {}, live: false, filter: 'open', text: '', files: [], busy: '', err: '', admin: false, hours: '', sheetHours: null, until: 0, sheetUntil: '', screens: '', sheetScreens: '', screen: '' };
var $app = document.getElementById('app'), $pick = document.getElementById('pick'), $viewer = document.getElementById('viewer'), $sheet = document.getElementById('sheet');
var fb = null;

function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
function load(k) { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function linkify(s) { return esc(s).replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; }); }

// 간단한 마크다운(2026-11-20 저자 '모든 페이지 다 마크다운 적용'). 먼저 글자를 안전하게 바꾼 뒤 모양만 입힌다(손님이 쓴 HTML은 그대로 글자로 보임)
// 되는 것: **굵게** *기울임* ~~취소선~~ `코드` · 1. 번호 목록 · - 점 목록 · # 제목 · > 인용 · --- 줄 · 주소는 링크 · 빈 줄은 문단
function mdInline(s) {
  return linkify(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
    .replace(/(^|[^*\w])\*([^*\s][^*]*?)\*(?!\w)/g, '$1<i>$2</i>').replace(/~~([^~]+)~~/g, '<s>$1</s>');
}
function md(s) {
  var lines = String(s || '').replace(/\r/g, '').split('\n'), out = [], para = [], list = null;
  function flushP() { if (para.length) out.push('<p>' + para.map(mdInline).join('<br>') + '</p>'); para = []; }
  function flushL() { if (list) out.push((list.t === 'ol' ? '<ol' + (list.start > 1 ? ' start="' + list.start + '"' : '') + '>' : '<ul>') + list.items.map(function (x) { return '<li>' + mdInline(x) + '</li>'; }).join('') + '</' + list.t + '>'); list = null; }
  lines.forEach(function (l) {
    var m;
    if (!l.trim()) { flushP(); flushL(); return; }
    if ((m = l.match(/^\s*(\d+)[.)]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ol') { flushL(); list = { t: 'ol', start: +m[1], items: [] }; } list.items.push(m[2]); return; }
    if ((m = l.match(/^\s*[-*•·]\s+(.*)$/))) { flushP(); if (!list || list.t !== 'ul') { flushL(); list = { t: 'ul', items: [] }; } list.items.push(m[1]); return; }
    flushL();
    if ((m = l.match(/^\s*#{1,6}\s+(.*)$/))) { flushP(); out.push('<h4>' + mdInline(m[1]) + '</h4>'); return; }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { flushP(); out.push('<hr>'); return; }
    if ((m = l.match(/^\s*>\s?(.*)$/))) { flushP(); out.push('<blockquote>' + mdInline(m[1]) + '</blockquote>'); return; }
    para.push(l);
  });
  flushP(); flushL();
  return '<div class="md">' + out.join('') + '</div>';
}
function mdPlain(s) { return String(s || '').replace(/[*_~`#>]/g, '').replace(/^\s*(\d+[.)]|[-•·])\s+/, '').trim(); }   // 접힌 첫 줄 미리보기용
function me() { return S.name || '익명'; }
function ago(t) {
  if (!t) return '';
  var m = Math.round((Date.now() - t) / 60000);
  if (m < 1) return '방금';
  if (m < 60) return m + '분 전';
  var h = Math.round(m / 60);
  if (h < 24) return h + '시간 전';
  var d = new Date(t);
  return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0');
}
function toast(t) {
  var el = document.createElement('div'); el.className = 'toast'; el.textContent = t;
  document.body.appendChild(el); setTimeout(function () { el.remove(); }, 2500);
}
function newId() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }
function kb(n) { return n >= 1048576 ? (n / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(n / 1024)) + 'KB'; }
function hourList(s) { return String(s || '').split(',').filter(Boolean).map(Number).filter(function (h) { return h >= 0 && h < 24; }).sort(function (a, b) { return a - b; }); }

// ---------- 첨부 만들기 ----------
function loadImg(src) { return new Promise(function (ok, no) { var i = new Image(); i.onload = function () { ok(i); }; i.onerror = no; i.src = src; }); }
function readUrl(blob) { return new Promise(function (ok, no) { var r = new FileReader(); r.onload = function () { ok(r.result); }; r.onerror = no; r.readAsDataURL(blob); }); }
function encode(img, w, h, q) {
  var c = document.createElement('canvas'); c.width = w; c.height = h;
  var x = c.getContext('2d'); x.fillStyle = '#fff'; x.fillRect(0, 0, w, h); x.drawImage(img, 0, 0, w, h);
  return c.toDataURL('image/jpeg', q);
}
// 사진: 긴 변 MAX_SIDE까지 원본 크기, JPEG 0.92(너무 크면 0.82). 목록용 작은 사진(t)은 짧은 변 200px.
// 사진이 아닌 파일: 그대로(MAX_FILE까지).
async function prep(file) {
  if (/^image\//.test(file.type) && !/svg|gif/.test(file.type)) {
    try {
      var u = URL.createObjectURL(file), img = await loadImg(u); URL.revokeObjectURL(u);
      var w = img.naturalWidth, h = img.naturalHeight;
      var k = Math.min(1, MAX_SIDE / Math.max(w, h), Math.sqrt(16e6 / (w * h)));
      var cw = Math.round(w * k), ch = Math.round(h * k);
      var d = encode(img, cw, ch, 0.92);
      if (d.length > 6.5e6) d = encode(img, cw, ch, 0.82);
      // 작은 사진은 규칙 한도(4만 자) 안에 들 때까지 화질 → 크기 순으로 낮춘다
      var t = '', side = 200;
      for (var tries = 0; tries < 8 && (!t || t.length > 36000); tries++) {
        var tk = Math.min(1, side / Math.min(w, h), side * 3 / Math.max(w, h));
        t = encode(img, Math.max(1, Math.round(w * tk)), Math.max(1, Math.round(h * tk)), [0.7, 0.55, 0.4][tries % 3]);
        if (tries % 3 === 2) side = Math.round(side * 0.75);
      }
      var nm = (file.name || '사진').replace(/\.[^.]+$/, '') + '.jpg';
      return { id: newId(), d: d, meta: { name: nm.slice(0, 200), type: 'image/jpeg', size: Math.round(d.length * 3 / 4), w: cw, h: ch, t: t } };
    } catch (e) { /* 그림으로 못 읽으면 파일로 둔다 */ }
  }
  if (file.size > MAX_FILE) throw new Error('"' + file.name + '"은 ' + kb(file.size) + '라 넣을 수 없어요(파일은 ' + kb(MAX_FILE) + '까지)');
  return { id: newId(), d: await readUrl(file), meta: { name: (file.name || '파일').slice(0, 200), type: (file.type || 'application/octet-stream').slice(0, 100), size: file.size } };
}
// target: 비우면 새 요청, 요청 id면 고치는 중인 그 요청
async function addFiles(list, target) {
  list = Array.prototype.slice.call(list || []);
  var e = target ? S.ed[target] : null;
  if (!list.length || (target && !e)) return;
  var cur = e ? e.files : S.files, setErr = function (m) { if (e) e.err = m; else S.err = m; };
  if (cur.length + list.length > MAX_FILES) { setErr('첨부는 요청 하나에 ' + MAX_FILES + '개까지예요'); render(); return; }
  setErr(''); if (e) e.busy = 'prep'; else S.busy = 'prep'; render();
  for (var i = 0; i < list.length; i++) {
    try { cur.push(await prep(list[i])); } catch (x) { setErr(x.message); }
  }
  if (e) e.busy = ''; else S.busy = ''; render();
}

// ---------- 첨부 보이기 ----------
function ext(m) { var x = /\.([a-z0-9]{1,5})$/i.exec(m.name || ''); return x ? x[1] : (m.type.split('/')[1] || '파일').slice(0, 5); }
function isImg(m) { return /^image\//.test(m.type) && m.t; }
// files: [{id, meta}] · draft면 지우기(✕) 단추
function attHtml(files, owner, draft) {
  var imgs = '', docs = '';
  files.forEach(function (f) {
    var m = f.meta, x = draft ? '<button class="att-x" data-act="unattach" data-o="' + owner + '" data-f="' + f.id + '" aria-label="빼기">✕</button>' : '';
    var key = ' data-f="' + f.id + '" data-o="' + owner + '"';
    if (isImg(m)) imgs += '<span class="att-img"><button class="att-open" data-act="view"' + key + ' aria-label="크게 보기"><img src="' + m.t + '" alt=""></button>' + x + '</span>';
    else docs += '<span class="att-file"><span class="ext">' + esc(ext(m)) + '</span><button class="att-name" data-act="view"' + key + '>' + esc(m.name) + '<span class="sz">' + kb(m.size) + ' · 눌러서 열기</span></button>' + x + '</span>';
  });
  return '<div class="att">' + imgs + docs + '</div>';
}

var cache = {}; // fid → object URL
async function blobUrl(fid) {
  if (cache[fid]) return cache[fid];
  var d = DEMO ? demo.blobs[fid] : await fb.getBlob(fid);
  if (!d) throw new Error('파일을 찾지 못했어요');
  var b = await (await fetch(d)).blob();
  return (cache[fid] = URL.createObjectURL(b));
}
function findFile(owner, fid) {
  if (owner === 'draft' || /^ed:/.test(owner)) {
    var list = owner === 'draft' ? S.files : (S.ed[owner.slice(3)] || {}).files || [];
    var f = list.filter(function (x) { return x.id === fid; })[0]; return f && { meta: f.meta, d: f.d };
  }
  var r = S.reqs[owner]; return r && r.files && r.files[fid] ? { meta: r.files[fid] } : null;
}
async function view(owner, fid) {
  var f = findFile(owner, fid); if (!f) return;
  var m = f.meta;
  if (!isImg(m)) {
    // 사진이 아닌 파일: 새 탭에서 연다(PDF는 브라우저가 미리 보여 줌). 창은 누른 순간 열어 둬야 막히지 않는다
    var w = window.open('', '_blank');
    try {
      var u = f.d ? URL.createObjectURL(await (await fetch(f.d)).blob()) : await blobUrl(fid);
      if (w) w.location.href = u; else location.href = u;
    } catch (e) { if (w) w.close(); toast(e.message); }
    return;
  }
  $viewer.innerHTML = '<div class="vbar"><button class="btn" data-v="close">닫기</button><span class="nm">' + esc(m.name) + (m.w ? ' · ' + m.w + '×' + m.h : '') +
    '</span><button class="btn" data-v="real">실제 크기</button><a class="btn" data-v="save" download="' + esc(m.name) + '">받기</a></div><div class="vbody"><p>불러오는 중…</p></div>';
  $viewer.classList.add('on'); document.body.style.overflow = 'hidden';
  // 휴대폰 '뒤로'가 페이지를 떠나지 않고 크게 보기만 닫게, 열 때 기록 한 칸을 넣는다
  if (!(history.state && history.state.viewer)) history.pushState({ viewer: 1 }, '');
  try {
    var src = f.d ? f.d : await blobUrl(fid);
    if (!$viewer.classList.contains('on')) return;
    $viewer.querySelector('.vbody').innerHTML = '<img src="' + src + '" alt="">';
    $viewer.querySelector('[data-v="save"]').href = src;
  } catch (e) { $viewer.querySelector('.vbody').innerHTML = '<p>' + esc(e.message) + '</p>'; }
}
$viewer.addEventListener('click', function (e) {
  var b = e.target.closest('[data-v]'); if (!b) return;
  if (b.dataset.v === 'close') { if (history.state && history.state.viewer) history.back(); else closeViewer(); }
  else if (b.dataset.v === 'real') { var v = $viewer.querySelector('.vbody'); v.classList.toggle('real'); b.textContent = v.classList.contains('real') ? '화면에 맞춤' : '실제 크기'; }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $viewer.classList.contains('on')) $viewer.querySelector('[data-v="close"]').click(); });
function closeViewer() { $viewer.classList.remove('on'); $viewer.innerHTML = ''; document.body.style.overflow = ''; }
window.addEventListener('popstate', function () { if ($viewer.classList.contains('on')) closeViewer(); });

// ---------- 저장소(Firebase) ----------
async function connect() {
  if (DEMO) return demoConnect();
  var base = 'https://www.gstatic.com/firebasejs/10.12.2/';
  var app = await import(base + 'firebase-app.js');
  var d = await import(base + 'firebase-database.js');
  var db = d.getDatabase(app.initializeApp({ databaseURL: DB_URL }));
  var R = function (p) { return d.ref(db, 'pages/' + PAGE + '/' + p); };
  fb = {
    putBlob: function (fid, data) { return d.set(R('blobs/' + fid), { d: data }); },
    getBlob: function (fid) { return d.get(R('blobs/' + fid + '/d')).then(function (s) { return s.val(); }); },
    delBlob: function (fid) { return d.remove(R('blobs/' + fid)).catch(function () {}); },
    putReq: function (id, v) { return d.set(R('requests/' + id), v); },
    setStatus: function (id, st) { return d.set(R('requests/' + id + '/status'), st); },
    setReply: function (id, v) { return v ? d.set(R('requests/' + id + '/reply'), v) : d.remove(R('requests/' + id + '/reply')); },
    delReq: function (id) { return d.remove(R('requests/' + id)); },
    editReq: function (id, v) { return d.update(R('requests/' + id), v); },
    setHours: function (h) { return d.set(R('settings/hours'), h); },
    setNote: function (t) { return t ? d.set(R('settings/note'), t) : d.remove(R('settings/note')); },
    setSeen: function (id, v) { return d.set(R('requests/' + id + '/seen'), v); },
    setScreens: function (s) { return s ? d.set(R('settings/screens'), s) : d.remove(R('settings/screens')); },
    setUntil: function (ms) { return ms ? d.set(R('settings/until'), ms) : d.remove(R('settings/until')); }
  };
  d.onValue(R('requests'), function (s) { S.reqs = s.val() || {}; S.live = true; render(); },
    function (err) { toast('요청을 불러오지 못했습니다: ' + err.message); });
  d.onValue(R('settings/hours'), function (s) { S.hours = s.val() || ''; });
  d.onValue(R('settings/note'), function (s) { S.note = s.val() || ''; S.got.note = 1; render(); });
  d.onValue(R('settings/until'), function (s) { S.until = s.val() || 0; S.got.until = 1; render(); });
  d.onValue(R('settings/screens'), function (s) { S.screens = s.val() || ''; S.got.screens = 1; render(); });
}

async function send() {
  var text = S.text.trim();
  if (!text && !S.files.length) { S.err = '요청 내용을 적거나 스크린샷을 넣어 주세요'; render(); return; }
  S.err = ''; var files = {}, n = S.files.length;
  try {
    for (var i = 0; i < n; i++) {
      S.busy = '올리는 중 ' + (i + 1) + '/' + n; render();
      var f = S.files[i];
      if (DEMO) demo.blobs[f.id] = f.d; else await fb.putBlob(f.id, f.d);
      files[f.id] = f.meta;
    }
    S.busy = '보내는 중'; render();
    var v = { text: text, by: me(), at: Date.now(), status: 'new' };
    if (n) v.files = files;
    if (S.screen) v.screen = S.screen;
    var id = newId();
    if (DEMO) demo.put(id, v); else await fb.putReq(id, v);
    S.mine.push(id); store('rq_mine', JSON.stringify(S.mine.slice(-200)));
    S.text = ''; S.files = []; S.screen = ''; store('rq_draft', null); S.busy = ''; render();
    toast('요청을 보냈습니다');
  } catch (e) {
    S.busy = ''; S.err = '보내지 못했어요: ' + (e && e.message || '인터넷 연결을 확인해 주세요'); render();
  }
}

// 요청 고치기: 쓴 사람(이 기기에서 보낸 요청)과 운영진. 새 첨부 원본을 먼저 올리고, 글·첨부 목록을 바꾼 뒤, 뺀 첨부 원본을 지운다
async function esave(id) {
  var e = S.ed[id]; if (!e) return;
  var text = e.text.trim();
  if (!text && !e.files.length) { e.err = '요청 내용을 적거나 첨부를 넣어 주세요'; render(); return; }
  e.busy = 'save'; e.err = ''; render();
  try {
    var map = null;
    for (var i = 0; i < e.files.length; i++) {
      var f = e.files[i];
      if (f.d && !f.up) { if (DEMO) demo.blobs[f.id] = f.d; else await fb.putBlob(f.id, f.d); f.up = true; }
      (map = map || {})[f.id] = f.meta;
    }
    var gone = Object.keys((S.reqs[id] || {}).files || {}).filter(function (k) { return !map || !map[k]; });
    var v = { text: text || null, files: map };
    if (DEMO) demo.edit(id, v); else await fb.editReq(id, v);
    gone.forEach(function (k) { if (DEMO) delete demo.blobs[k]; else fb.delBlob(k); });
    delete S.ed[id]; toast('고친 내용을 저장했습니다'); render();
  } catch (err) { e.busy = ''; e.err = '저장하지 못했어요: ' + (err && err.message || '인터넷 연결을 확인해 주세요'); render(); }
}

// ---------- 화면 ----------
// 요청·안내 글·기간·화면 목록이 다 올 때까지 그리지 않는다: 칸이 하나씩 끼어드는 단계 로딩을 없앰(2026-11-21). 4초 넘게 안 오면 있는 것부터 그린다
function ready() { return (S.live && (DEMO || (S.got.note && S.got.until && S.got.screens))) || S.slow; }

    h += attHtml(ed.files, 'ed:' + r.id, !ed.busy);
    h += '<div class="row"><button class="btn main" data-act="esave" data-id="' + r.id + '"' + (ed.busy ? ' disabled' : '') + '>고친 내용 저장</button>';
    h += '<button class="btn" data-act="attach" data-id="' + r.id + '"' + (ed.busy ? ' disabled' : '') + '>사진·파일 넣기</button>';
    h += '<button class="btn push" data-act="eclose" data-id="' + r.id + '">취소</button></div>';
    h += '<div class="msg' + (ed.err ? ' bad' : '') + '">' + esc(ed.busy === 'prep' ? '사진 준비 중…' : ed.busy ? '저장 중…' : ed.err || '') + '</div></div>';
  } else if (r.text) h += md(r.text);
  var files = Object.keys(r.files || {}).map(function (k) { return { id: k, meta: r.files[k] }; });
  if (files.length && !ed) h += attHtml(files, r.id, false);
  var rp = r.reply && r.reply.text ? r.reply : null;
  if (rp && !S.rOpen[r.id]) h += '<div class="reply"><div class="rh"><b>답글</b> · ' + ago(rp.at) + '</div>' + md(rp.text) + '</div>';
  if (S.admin && S.rOpen[r.id]) {
    var bz = S.rBusy[r.id];
    h += '<div class="reply-edit"><textarea id="rp-' + r.id + '" data-rid="' + r.id + '" placeholder="무엇을 어떻게 고쳤는지 적어 주세요. 비우고 저장하면 답글이 지워집니다.">' + esc(S.rDraft[r.id] || '') + '</textarea>';
    h += '<div class="row"><button class="btn main" data-act="rsave" data-id="' + r.id + '"' + (bz ? ' disabled' : '') + '>답글 저장</button>';
    if (st !== 'done') h += '<button class="btn" data-act="rdone" data-id="' + r.id + '"' + (bz ? ' disabled' : '') + '>저장하고 끝으로</button>';
    h += '<button class="btn push" data-act="rclose" data-id="' + r.id + '">취소</button></div></div>';
  }
  // 끝난 요청: 쓴 쪽이 '확인했어요' 한 번(2026-11-20 저자 '어 해', 무기고 Hooked '보상 뒤 작은 투자'). 누가 언제 확인했는지 남음
  if (st === 'done') {
    if (r.seen) h += '<div class="seen">✓ ' + esc(r.seen.by || '익명') + '님이 확인 · ' + ago(r.seen.at) + '</div>';
    else if (!S.admin) h += '<div class="seen"><button class="btn" data-act="seen" data-id="' + r.id + '">확인했어요</button><span>고친 것을 보셨으면 눌러 주세요</span></div>';
    else h += '<div class="seen">아직 확인 전</div>';
  }
  if (S.admin) {
    h += '<div class="row adm"><span class="seg">';
    ['new', 'doing', 'done'].forEach(function (k) { h += '<button data-act="status" data-id="' + r.id + '" data-v="' + k + '" class="' + (st === k ? 'on' : '') + '">' + STATUS[k] + '</button>'; });
    h += '</span>';
    h += '<button class="btn rbtn" data-act="ropen" data-id="' + r.id + '"' + (S.rOpen[r.id] ? ' disabled' : '') + '>답글</button>';
    h += '<button class="btn red push" data-act="del" data-id="' + r.id + '">지우기</button></div>';
  }
  return h + '</div>';
}

// ---------- 수정 기간 타이머(2026-11-20 저자 '내가 며칠까지 설정하면 29일 12시간처럼 시간 단위로 줄어들게') ----------
// 날짜(YYYYMMDD)를 고르면 그날 밤 12시(한국 시간)에 끝난다. 화면은 일·시간까지만 보여 1분마다 다시 셈해도 1시간에 한 번만 바뀐다
var DAY = 86400000, KST = 9 * 3600000;
function untilFromDate(s) {
  var m = String(s || '').replace(/\D/g, '').match(/^(\d{4})(\d{2})(\d{2})$/); if (!m) return 0;
  var t = Date.UTC(+m[1], +m[2] - 1, +m[3] + 1) - KST;                    // 그날 다음 날 0시(한국) = 그날 밤 12시
  var back = new Date(t - DAY + KST); return back.getUTCMonth() + 1 === +m[2] && back.getUTCDate() === +m[3] ? t : 0;   // 없는 날짜(2월 30일 등)는 0
}
function dateOfUntil(ms) { var d = new Date(ms - 1 + KST); /* 끝나는 때(밤 12시) 바로 앞 = 그날 */ return { y: d.getUTCFullYear(), m: d.getUTCMonth() + 1, d: d.getUTCDate(), w: '일월화수목금토'[d.getUTCDay()] }; }
function periodText() {
  var left = S.until - Date.now();
  if (left <= 0) return '수정 기간 끝남';
  var dd = Math.floor(left / DAY), hh = Math.floor(left % DAY / 3600000);
  return '수정 기간 ' + (dd ? dd + '일 ' + hh + '시간' : hh ? hh + '시간' : '1시간 안쪽');
}
document.addEventListener('toggle', function (e) { if (e.target.id !== 'note-d') return; S.noteOpen = e.target.open; var m = e.target.querySelector('.nmore'); if (m) m.textContent = S.noteOpen ? '접기' : '펼치기'; }, true);
setInterval(function () { var el = document.getElementById('period'); if (el && S.until) el.textContent = periodText(); }, 60000);

// ---------- 설정(제목을 10번 누르면) ----------
var taps = 0, lastTap = 0;
function openSheet() {
  S.admin = true; store('rq_admin', '1'); render();
  S.sheetHours = hourList(S.hours); S.sheetNote = S.note; S.sheetScreens = S.screens;
  S.sheetUntil = S.until ? (function (e) { return e.y + String(e.m).padStart(2, '0') + String(e.d).padStart(2, '0'); })(dateOfUntil(S.until)) : '';
  drawSheet(); $sheet.classList.add('on');
}
function drawSheet(msg) {
  var hs = S.sheetHours, h = '<div class="sheet-in"><button class="sheet-x" data-s="close" aria-label="닫기">✕</button><h3>맨 위 한마디</h3>';
  h += '<p>적으면 페이지 맨 위(새 요청 위)에 모두에게 보입니다. 비우고 저장하면 사라집니다.</p>';
  h += '<textarea id="sheet-note" maxlength="1000" placeholder="예: 이번 주는 회비 화면부터 고칩니다. 급한 건 카톡 주세요.">' + esc(S.sheetNote) + '</textarea>';
  h += '<h3 style="margin-top:18px">화면 이름</h3>';
  h += '<p>쉼표로 나눠 적으면 새 요청 칸 위에 누르는 단추로 나옵니다(6개 이하가 좋아요). 비우면 안 나옵니다.</p>';
  h += '<input id="sheet-screens" maxlength="300" placeholder="홈,일정,회원명단,회비,가입신청,기타" value="' + esc(S.sheetScreens) + '" style="width:100%;height:44px;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:0 12px">';
  h += '<h3 style="margin-top:18px">수정 기간</h3>';
  h += '<p>끝나는 날을 숫자 8자리로 쓰면(예: 20261220) 그날 밤 12시까지 남은 시간이 제목 옆에 작게 \'수정 기간 29일 12시간\'처럼 보입니다. 비우고 저장하면 사라집니다.</p>';
  h += '<input id="sheet-until" inputmode="numeric" maxlength="8" placeholder="20261220" value="' + esc(S.sheetUntil) + '" style="width:100%;height:44px;font-size:16px;border:1px solid var(--line);border-radius:8px;padding:0 12px">';
  h += '<h3 style="margin-top:18px">알림 시간</h3>';
  h += '<p>고른 시간(한국 시간, 정시)마다 그사이 들어온 새 요청 수를 휴대폰으로 한 번에 보냅니다. 새 요청이 없으면 보내지 않습니다. \'하는 중\'·\'끝\'으로 바꾼 요청은 알림 개수에 넣지 않습니다. 맥이 1분마다 확인해 정한 시간에 맞춰 보내고, 맥이 모두 꺼져 있으면 GitHub이 대신 보내 늦을 수 있습니다.</p>';
  h += '<div class="hours">';
  for (var i = 0; i < 24; i++) h += '<button data-s="hour" data-v="' + i + '" class="' + (hs.indexOf(i) >= 0 ? 'on' : '') + '">' + i + '시</button>';
  h += '</div><p>' + (hs.length ? '지금 고른 시간: 매일 ' + hs.map(function (x) { return x + '시'; }).join(' · ') : '고른 시간이 없어 알림이 가지 않습니다.') + '</p>';
  h += '<div class="row"><button class="btn main" data-s="save">저장</button><button class="btn" data-s="test">시험 알림 보내기</button><button class="btn push" data-s="close">닫기</button></div>';
  h += '<div class="msg">' + esc(msg || '') + '</div>';
  h += '<p style="margin-top:14px">휴대폰 ntfy 앱에서 아래 주제를 구독하면 알림을 받습니다.</p><div class="topic">' + esc(NTFY) + '</div>';
  h += '<p style="margin-top:14px">이 기기에서는 요청마다 상태 바꾸기·지우기 단추가 보입니다.</p><div class="row"><button class="btn" data-s="off">이 기기에서 관리 단추 숨기기</button></div>';
  $sheet.innerHTML = h + '</div>';
}
$sheet.addEventListener('input', function (e) { if (e.target.id === 'sheet-note') S.sheetNote = e.target.value; if (e.target.id === 'sheet-until') S.sheetUntil = e.target.value; if (e.target.id === 'sheet-screens') S.sheetScreens = e.target.value; });
$sheet.addEventListener('click', function (e) {
  var b = e.target.closest('[data-s]'); if (!b) return;
  var s = b.dataset.s;
  if (s === 'hour') {
    var v = +b.dataset.v, i = S.sheetHours.indexOf(v);
    if (i >= 0) S.sheetHours.splice(i, 1); else S.sheetHours.push(v);
    S.sheetHours.sort(function (a, b) { return a - b; }); drawSheet();
  } else if (s === 'save') {
    var val = S.sheetHours.join(','), note = S.sheetNote.trim().slice(0, 1000), ut = S.sheetUntil.trim() ? untilFromDate(S.sheetUntil) : 0;
    if (S.sheetUntil.trim() && !ut) { drawSheet('수정 기간 날짜를 숫자 8자리로 써 주세요(예: 20261220)'); return; }
    var scr = screenList(S.sheetScreens).join(',');
    (DEMO ? Promise.resolve((demo.settings.hours = val, S.note = note, S.until = ut, S.screens = scr, render())) : Promise.all([fb.setHours(val), fb.setNote(note), fb.setUntil(ut), fb.setScreens(scr)]))
      .then(function () { S.hours = val; S.sheetNote = note; S.until = ut; S.screens = scr; S.sheetScreens = scr; render(); drawSheet('저장했습니다'); })
      .catch(function (err) { drawSheet('저장하지 못했어요: ' + err.message); });
  } else if (s === 'test') {
    if (DEMO || !NTFY) { drawSheet('시험 화면에서는 보내지 않습니다'); return; }
    fetch('https://ntfy.sh/' + NTFY, { method: 'POST', body: TITLE + ': 시험 알림입니다', headers: { Tags: 'bell', Click: location.href.split('?')[0] } })
      // ntfy가 거절해도(429 하루 한도 등) fetch는 성공으로 끝나니 응답 번호를 본다(2026-11-20 '보냈습니다'인데 안 옴)
      .then(function (r) {
        if (r.ok) return drawSheet('보냈습니다. 휴대폰을 확인해 주세요');
        drawSheet(r.status === 429 ? '못 보냈어요: 이 인터넷의 하루 알림 한도(250개)가 찼어요. 휴대폰 데이터로 바꿔 누르거나 내일 눌러 주세요'
          : '보내지 못했어요(ntfy 응답 ' + r.status + ')');
      }).catch(function () { drawSheet('보내지 못했어요: 인터넷 연결을 확인해 주세요'); });
  } else if (s === 'off') {
    S.admin = false; store('rq_admin', null); $sheet.classList.remove('on'); render();
  } else if (s === 'close') { $sheet.classList.remove('on'); }
});

// ---------- 누르기 ----------
$app.addEventListener('input', function (e) {
  if (e.target.id === 'rq-text') { S.text = e.target.value; store('rq_draft', S.text || null); }
  else if (e.target.dataset.rid) S.rDraft[e.target.dataset.rid] = e.target.value;
  else if (e.target.dataset.eid && S.ed[e.target.dataset.eid]) S.ed[e.target.dataset.eid].text = e.target.value;
});
$app.addEventListener('paste', function (e) {
  var fs = e.clipboardData && e.clipboardData.files;
  if (fs && fs.length && e.target.id === 'rq-text') { e.preventDefault(); addFiles(fs); }
  else if (fs && fs.length && e.target.dataset.eid) { e.preventDefault(); addFiles(fs, e.target.dataset.eid); }
});
$app.addEventListener('dragover', function (e) { if (e.target.closest('#rq-form')) { e.preventDefault(); e.target.closest('#rq-form').classList.add('drop'); } });
$app.addEventListener('dragleave', function (e) { var f = e.target.closest('#rq-form'); if (f) f.classList.remove('drop'); });
$app.addEventListener('drop', function (e) { var f = e.target.closest('#rq-form'); if (f) { e.preventDefault(); f.classList.remove('drop'); addFiles(e.dataTransfer.files); } });
var pickFor = null;
$pick.addEventListener('change', function () { var fs = $pick.files; addFiles(fs, pickFor).then(function () { $pick.value = ''; }); });

$app.addEventListener('click', function (e) {
  var b = e.target.closest('[data-act]'); if (!b) return;
  var act = b.dataset.act, id = b.dataset.id;
  if (act === 'title') {
    var now = Date.now(); taps = now - lastTap < 1500 ? taps + 1 : 1; lastTap = now;
    if (taps >= 10) { taps = 0; openSheet(); }
  } else if (act === 'rename') {
    var n = window.prompt('이름 (요청 옆에 표시돼요. 비우면 익명)', S.name);
    if (n !== null) { S.name = n.trim().slice(0, 30); store('qp_name', S.name || null); render(); }
  } else if (act === 'filter') {
    S.filter = b.dataset.v; render();
  } else if (act === 'attach') {
    pickFor = id || null; $pick.click();
  } else if (act === 'unattach') {
    var o = b.dataset.o, keep = function (f) { return f.id !== b.dataset.f; };
    if (/^ed:/.test(o)) { var ee = S.ed[o.slice(3)]; if (ee) { ee.files = ee.files.filter(keep); ee.err = ''; } }
    else { S.files = S.files.filter(keep); S.err = ''; }
    render();
  } else if (act === 'eopen') {
    var r0 = S.reqs[id] || {};
    S.ed[id] = { text: r0.text || '', files: Object.keys(r0.files || {}).map(function (k) { return { id: k, meta: r0.files[k] }; }), err: '', busy: '' };
    render(); var et = document.getElementById('ed-' + id); if (et) et.focus();
  } else if (act === 'eclose') {
    delete S.ed[id]; render();
  } else if (act === 'esave') {
    esave(id);
  } else if (act === 'send') {
    send();
  } else if (act === 'view') {
    view(b.dataset.o, b.dataset.f);
  } else if (act === 'scr') {
    S.screen = S.screen === b.dataset.v ? '' : b.dataset.v; render();
  } else if (act === 'seen') {
    var sv = { by: me(), at: Date.now() };
    if (DEMO) demo.seen(id, sv); else fb.setSeen(id, sv).catch(function (err) { toast('저장하지 못했어요: ' + err.message); });
  } else if (act === 'status') {
    var v = b.dataset.v;
    if (DEMO) demo.status(id, v); else fb.setStatus(id, v).catch(function (err) { toast('바꾸지 못했어요: ' + err.message); });
  } else if (act === 'ropen') {
    S.rOpen[id] = true; S.rDraft[id] = ((S.reqs[id] || {}).reply || {}).text || ''; render();
    var ta = document.getElementById('rp-' + id); if (ta) ta.focus();
  } else if (act === 'rclose') {
    delete S.rOpen[id]; delete S.rDraft[id]; render();
  } else if (act === 'rsave' || act === 'rdone') {
    var txt = (S.rDraft[id] || '').trim().slice(0, 2000), v = txt ? { text: txt, at: Date.now() } : null;
    S.rBusy[id] = true; render();
    var p = DEMO ? Promise.resolve(demo.reply(id, v, act === 'rdone')) :
      fb.setReply(id, v).then(function () { if (act === 'rdone') return fb.setStatus(id, 'done'); });
    p.then(function () { S.rBusy[id] = false; delete S.rOpen[id]; delete S.rDraft[id]; toast(v ? '답글을 저장했습니다' : '답글을 지웠습니다'); render(); })
     .catch(function (err) { S.rBusy[id] = false; toast('저장하지 못했어요: ' + err.message); render(); });
  } else if (act === 'del') {
    if (!window.confirm('이 요청을 지울까요? 넣은 사진·파일도 함께 지워지고 되돌릴 수 없습니다.')) return;
    var fids = Object.keys((S.reqs[id] || {}).files || {});
    if (DEMO) { demo.del(id); return; }
    fb.delReq(id).then(function () { fids.forEach(fb.delBlob); toast('지웠습니다'); }).catch(function (err) { toast('지우지 못했어요: ' + err.message); });
  }
});

// 1분마다 다시 그려 '3분 전' 같은 시간을 새로 맞춘다(쓰는 중이면 건너뜀)
setInterval(function () { if (!S.busy && !Object.keys(S.rOpen).length && !Object.keys(S.ed).length && document.activeElement && document.activeElement.tagName !== 'TEXTAREA') render(); }, 60000);

// ---------- 시험용 가짜 저장소 (?demo) ----------
var demo = null;
function demoConnect() {
  var db = {
    a1: { text: '회원명단에서 연락처가 잘려 보여요. 아래 스크린샷 참고해 주세요.', by: '홍길동', at: Date.now() - 3 * 3600000, status: 'new' },
    a2: { text: '일정 화면 글씨를 조금 더 크게 해 주세요', by: '김철수', at: Date.now() - 26 * 3600000, status: 'doing' },
    a3: { text: '끝난 요청 예시', by: '익명', at: Date.now() - 50 * 3600000, status: 'done', reply: { text: '일정 화면 글씨를 16px에서 18px로 키웠어요.', at: Date.now() - 40 * 3600000 } }
  };
  function push() { S.reqs = JSON.parse(JSON.stringify(db)); S.live = true; render(); }
  demo = {
    blobs: {}, settings: { hours: '9,18' },
    put: function (id, v) { db[id] = v; push(); },
    edit: function (id, v) { Object.keys(v).forEach(function (k) { if (v[k] == null) delete db[id][k]; else db[id][k] = v[k]; }); push(); },
    status: function (id, v) { db[id].status = v; push(); },
    seen: function (id, v) { db[id].seen = v; push(); },
    reply: function (id, v, done) { if (v) db[id].reply = v; else delete db[id].reply; if (done) db[id].status = 'done'; push(); },
    del: function (id) { delete db[id]; push(); }
  };
  S.screens = '홈,일정,회원명단,회비,가입신청,기타'; S.hours = '9,18'; S.until = Date.now() + 29 * DAY + 12.5 * 3600000;
  S.note = '이번 주는 회비 화면부터 고칩니다. 급한 건 카톡 주세요.\n둘째 줄: 사진은 한 번에 10장까지 넣을 수 있어요.\n셋째 줄: 끝난 요청은 \'전체\'에서 다시 볼 수 있어요.';
  setTimeout(push, 100);
}

// ---------- 시작 ----------
S.name = load('qp_name'); S.text = load('rq_draft'); S.admin = load('rq_admin') === '1';
try { S.mine = JSON.parse(load('rq_mine') || '[]'); } catch (e) { S.mine = []; }
render();
setTimeout(function () { if (S.dead) return; S.slow = true; render(); }, 4000);
connect().catch(function (err) { S.dead = true; $app.innerHTML = '<div class="gate"><p>불러오지 못했습니다: ' + esc(err && err.message) + '</p></div>'; });
window.__rq = { S: S, demo: function () { return demo; }, addFiles: addFiles }; // 점검용
</script>
